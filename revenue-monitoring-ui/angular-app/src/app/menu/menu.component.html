<mat-menu>
  <ng-container *ngFor="let item of menuItems">
    <!-- Render category if it exists -->
    {{ item }}
    <!-- Standalone menu item -->
    <ng-container>
      <button
        mat-menu-item
        [routerLink]="item.route"
        (click)="selectMenu(item.route)"
        [class.active]="activeRoute === item.route"
      >
        {{ item.label }}
      </button>
    </ng-container>
  </ng-container>
</mat-menu>
