<div class="ms-wrapper">
  <!-- Level 1: Sidebar rail (always collapsed) -->
  <div class="ms-rail collapsed">
    <nav class="ms-nav">
      @for (item of navItems; track item.label) {
        @if (isVisible(item)) {
          <button
            class="ms-nav-item"
            [class.active]="isRouteActive(item.route) || isParentActive(item)"
            [class.browsing]="
              activeDrawer === item.label && !isParentActive(item)
            "
            [class.has-children]="!!item.children?.length"
            (click)="toggleDrawer(item)"
          >
            <ng-icon [name]="item.icon" size="26" class="ms-nav-icon" />
            <span class="ms-nav-label-collapsed">
              {{ item.label }}
              @if (item.children?.length) {
                <ng-icon
                  name="phosphorCaretRightBold"
                  size="10"
                  class="ms-children-indicator"
                  [class.open]="activeDrawer === item.label"
                />
              }
            </span>
          </button>
        }
      }
    </nav>

    <!-- Footer placeholders -->
    <div class="ms-footer-items">
      <div class="ms-nav-item ms-disabled">
        <ng-icon name="phosphorRocketBold" size="26" class="ms-nav-icon" />
        <span class="ms-nav-label-collapsed">Coming Soon</span>
      </div>
      <div class="ms-nav-item ms-disabled">
        <ng-icon
          name="phosphorMegaphoneSimpleBold"
          size="26"
          class="ms-nav-icon"
        />
        <span class="ms-nav-label-collapsed">Latest Updates</span>
      </div>
    </div>
  </div>

  <!-- Level 2: Drawer -->
  <div class="ms-drawer" [class.open]="activeDrawer !== null">
    @for (item of navItems; track item.label) {
      @if (item.children?.length && activeDrawer === item.label) {
        <div class="ms-drawer-content">
          <div class="ms-drawer-header">
            <span class="ms-drawer-title">{{ item.label }}</span>
            <button class="ms-drawer-close" (click)="activeDrawer = null">
              <ng-icon name="phosphorXBold" size="16" />
            </button>
          </div>
          <nav class="ms-drawer-nav">
            @for (child of getVisibleChildren(item); track child.label) {
              <button
                class="ms-drawer-item"
                [class.active]="isRouteActive(child.route)"
                (click)="navigateTo(child.route!)"
              >
                <ng-icon
                  [name]="child.icon"
                  size="22"
                  class="ms-drawer-item-icon"
                />
                <span class="ms-drawer-item-label">{{ child.label }}</span>
              </button>
            }
          </nav>
        </div>
      }
    }
  </div>
</div>
