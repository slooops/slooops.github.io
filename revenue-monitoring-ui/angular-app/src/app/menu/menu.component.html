<div class="tab-container" *ngIf="showMenu">
  <!-- Burger Menu Icon (Above Tabs) -->
  <mat-icon class="menu-icon" (click)="toggleMenu()">menu</mat-icon>

  <!-- Tab Group -->
  <mat-tab-group class="custom-tab-group">
    <mat-tab label="Tab 1"> Content 1 </mat-tab>
    <mat-tab label="Tab 2"> Content 2 </mat-tab>
    <mat-tab label="Tab 3"> Content 3 </mat-tab>
  </mat-tab-group>
</div>
