<div class="hub-page">
  <!-- Tab bar -->
  <div class="hub-tabs">
    <button
      class="hub-tab"
      [class.active]="activeTab === 0"
      (click)="activeTab = 0"
    >
      AI in SDLC Summary
    </button>
    <button
      class="hub-tab"
      [class.active]="activeTab === 1"
      (click)="activeTab = 1"
    >
      Scorecard
    </button>
    <button
      class="hub-tab"
      [class.active]="activeTab === 2"
      (click)="activeTab = 2"
    >
      Sprint Updates
    </button>
    <div class="hub-tab-spacer"></div>
    <button class="btn btn-ghost hub-email-btn" (click)="exportCombined()">
      <ng-icon name="phosphorEnvelopeSimpleBold" size="16" />
      {{ activeTab === 2 ? "Email Tables" : "Email Table" }}
    </button>
  </div>

  <!-- Tab content -->
  <div class="hub-tab-content">
    @if (activeTab === 0) {
      <app-executive-summary [showEmailButton]="false" />
    }
    @if (activeTab === 1) {
      <app-scorecard [showEmailButton]="false" />
    }
    @if (activeTab === 2) {
      <app-sdlc-exec-update [showEmailButton]="false" />
      <app-sdlc-component-adoption [showEmailButton]="false" />
    }
  </div>

  <!-- Toast -->
  @if (toastMessage) {
    <div class="toast">{{ toastMessage }}</div>
  }
</div>
