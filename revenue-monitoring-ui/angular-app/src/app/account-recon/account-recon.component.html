<h5 style="text-align: center; font-weight: bold">Accounts</h5>

<app-monitoring-dashboard
  [urls]="accountsUrls"
  [keysToMap]="['SEQUENCE_NUMBER']"
  [processFlowKeys]="accountsTotals"
  [periodStatus]="periodStatus"
  [componentName]="'Accounts'"
  [processFlowTabsToDisplay]="['Accounts']"
  [specialWords]="specialWords"
  [skippedWords]="skippedWords"
  [dynamicTemplate]="accountsTemplate"
  [dynamicCss]="accountsprocessflowCss"
  [isSubAppMapping]="false"
  [warningMessage]="'Displays message with impacted accounting information'"
  [columnsToFilter]="accountsFilters"
  [summaryColumnsToHide]="['SEQUENCE_NUMBER']"
  [detailsColumnsToHide]="['TRANSACTION_DATE']"
  [submitKeysToMap]="['SEQUENCE_NUMBER']"
  [webexKeysToMap]="[
    'PERIOD_NAME',
    'APPLICATION_NAME',
    'PROCESS_FLOW',
    'ORG_NAME',
    'TRANSACTION_DATE',
    'AMOUNT'
  ]"
></app-monitoring-dashboard>

<ng-template #accountsTemplate let-allTotals="allTotals">
  <div class="flowchart-container">
    <div class="slider-bar">
      <div *ngFor="let step of formattedAccountsSteps; let i = index">
        <div class="circle-wrapper-loop">
          <p class="circle-caption-loop">{{ step.label }}</p>
          <p class="circle-loop"></p>
          <p class="circle-subcaption">
            Total Impact:
            {{ allTotals['Accounts']?.[step.impact] || 'N/A' }}
          </p>
        </div>

        <div
          *ngIf="i < formattedAccountsSteps.length - 1"
          class="chevron-wrapper-loop"
        >
          <div class="chevron"></div>
          <div class="chevron-white"></div>
        </div>
      </div>
    </div>
  </div>
</ng-template>

<div
  style="display: flex; justify-content: center; align-items: center !important"
>
  <ng-container *ngIf="!roles.length">
    <tr>
      <td colspan="100%" style="text-align: center">
        <app-loading-symbol></app-loading-symbol>
      </td>
    </tr>
  </ng-container>
</div>
