<app-monitoring-dashboard
  [urls]="eInvoicingUrls"
  [keysToMap]="preAndAutoInvoiceKeysToMap"
  [processFlowKeys]="eInvoicingTotals"
  [periodStatus]="periodStatus"
  [componentName]="'eInvoicing'"
  [processFlowTabsToDisplay]="['eInvoicing']"
  [dynamicTemplate]="eInvTemplate"
  [dynamicCss]="eInvprocessflowCss"
  [isSubAppMapping]="false"
  [warningMessage]="'Warning message '"
  [columnsToFilter]="eInvoicingFilters"
  [detailsColumnsToHide]="['TRANSACTION_DATE']"
  [submitKeysToMap]="[
    'PERIOD_NAME',
    'APPLICATION_NAME',
    'PROCESS_FLOW',
    'ORG_NAME',
    'TRANSACTION_DATE'
  ]"
  [webexKeysToMap]="[
    'PERIOD_NAME',
    'APPLICATION_NAME',
    'PROCESS_FLOW',
    'ORG_NAME',
    'TRANSACTION_DATE',
    'AMOUNT'
  ]"
></app-monitoring-dashboard>

<ng-template #eInvTemplate let-allTotals="allTotals">
  <div class="flowchart-container">
    <div class="slider-bar">
      <div *ngFor="let step of formattedeInvoicingSteps; let i = index">
        <div class="circle-wrapper-loop">
          <p class="circle-caption-loop">{{ step.label }}</p>
          <p class="circle-loop"></p>
          <p class="circle-subcaption">
            Total Impact:
            {{ allTotals['eInvoicing']?.[step.impact] || 'N/A' }}
          </p>
        </div>

        <div
          *ngIf="i < formattedeInvoicingSteps.length - 1"
          class="chevron-wrapper-loop"
        >
          <div class="chevron"></div>
          <div class="chevron-white"></div>
        </div>
      </div>
    </div>
  </div>
</ng-template>
