<app-o2c-nav></app-o2c-nav>
<div class="o2c-360-container">
  <app-o2c-sidebar-nav></app-o2c-sidebar-nav>

  <div class="o2c-column-container" [style.width]="invoiceContainerWidth">
    <p class="result-header">1 Order Result Found</p>

    <div class="o2c-card order-banner">
      <div class="order-info">
        <span class="status-dot"></span>
        <span class="order-id"
          ><strong>28221819418344</strong> Order Summary</span
        >
        <button class="details-button">Order Details</button>
      </div>
      <div class="chevron-icon"></div>
    </div>

    <div class="o2c-card order-banner process-flow-banner">
      <app-o2c-process-flow
        [circleStatus]="circleStatus"
        [navigationMap]="navigationMap"
        [stepValues]="{ Order: '$0', Subscription: '$63,000' }"
      ></app-o2c-process-flow>
    </div>

    <div
      class="o2c-card order-banner table-banner"
      (click)="toggleAccordion('subscription')"
    >
      <div class="order-info accordion-header">
        <i
          [ngClass]="{
            'plus-icon': !expanded.subscription,
            'minus-icon': expanded.subscription
          }"
        ></i>
        Subscription Summary
      </div>
    </div>
    <div *ngIf="expanded.subscription" class="accordion-content o2c-card">
      <table mat-table [dataSource]="subscriptionSummaryDataSource">
        <ng-container
          *ngFor="let column of subscriptionSummaryDisplayedColumns"
          [matColumnDef]="column"
        >
          <th mat-header-cell *matHeaderCellDef>
            {{ formatColumnName(column) }}
          </th>

          <td mat-cell *matCellDef="let element">{{ element[column] }}</td>
        </ng-container>

        <tr
          mat-header-row
          *matHeaderRowDef="subscriptionSummaryDisplayedColumns"
        ></tr>
        <tr
          mat-row
          *matRowDef="let row; columns: subscriptionSummaryDisplayedColumns"
        ></tr>
      </table>
    </div>

    <div
      class="o2c-card order-banner table-banner"
      (click)="toggleAccordion('invoice')"
    >
      <div class="order-info accordion-header">
        <i
          [ngClass]="{
            'plus-icon': !expanded.invoice,
            'minus-icon': expanded.invoice
          }"
        ></i>
        Invoice Summary
      </div>
    </div>
    <div *ngIf="expanded.invoice" class="accordion-content o2c-card">
      <div class="invoice-summary-table">
        <table mat-table [dataSource]="invoiceSummaryDataSource">
          <ng-container
            *ngFor="let column of invoiceSummaryDisplayedColumns"
            [matColumnDef]="column"
          >
            <th mat-header-cell *matHeaderCellDef>
              {{ formatColumnName(column) }}
            </th>

            <td mat-cell *matCellDef="let element">
              {{
                column === "TRX_DATE" || column === "DUE_DATE"
                  ? (element[column] | date : "MM/dd/yyyy")
                  : element[column]
              }}
            </td>
          </ng-container>

          <tr
            mat-header-row
            *matHeaderRowDef="invoiceSummaryDisplayedColumns"
          ></tr>
          <tr
            mat-row
            *matRowDef="let row; columns: invoiceSummaryDisplayedColumns"
          ></tr>
        </table>
      </div>
    </div>
  </div>
</div>
