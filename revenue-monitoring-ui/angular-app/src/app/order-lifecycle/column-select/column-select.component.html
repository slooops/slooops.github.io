<h5 mat-dialog-title>
  Columns Filter
  <a
    style="
      float: right !important;
      text-decoration: none;
      margin-top: 8px !important;
    "
  >
    <i
      class="fa fa-close"
      style="font-size: 20px; color: gray"
      (click)="closeDialog()"
    ></i
  ></a>
</h5>

<mat-dialog-content>
  <div style="border: 0.5px solid rgb(82, 81, 81)">
    <mat-selection-list #column (selectionChange)="logSelectedColumns($event)">
      <mat-list-option
        *ngFor="let column of displayedColumns"
        [value]="column"
        [selected]="
          selectedColumns.length > 0
            ? selectedColumns.includes(column.name)
            : column.selected
        "
        style="font-weight: 400; font-size: small"
        >{{ column.displayName }}</mat-list-option
      >
    </mat-selection-list>
  </div>
  <br />

  <div style="text-align: center !important">
    <button
      mat-raised-button
      style="background-color: #049fd9; color: white"
      (click)="save()"
    >
      Save
    </button>
  </div>
</mat-dialog-content>
