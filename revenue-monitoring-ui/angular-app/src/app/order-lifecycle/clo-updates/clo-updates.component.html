<div
  style="
    margin: -24px -24px 0 -24px; /* Removes default padding */
    background-color: #08ace4;
    padding: 10px;
    color: white;
    display: flex;
    justify-content: space-between;
    align-items: center;
  "
>
  <!-- Title on the left -->
  <h5 style="margin: 0; font-weight: 450">CLO Upload</h5>

  <!-- Icons on the right (Download and Close) -->
  <a style="text-decoration: none; cursor: pointer">
    <i
      class="fa fa-close"
      style="font-size: 16px; color: white"
      (click)="closeDialog('closed')"
    ></i>
  </a>
</div>

<div>
  <mat-tab-group>
    <mat-tab label="File Upload" style="text-align: center">
      <br />
      <div class="download-container">
        <a
          (click)="
            export('CLO Upload Sample Template', 'clo_upload_sample_template')
          "
        >
          <i class="svg-icon download-icon" aria-hidden="true"></i>
          <span>&nbsp;Download Sample Template</span>
        </a>
      </div>
      <br />
      <div
        class="file-drop-zone"
        (drop)="onDrop($event)"
        (dragover)="onDragOver($event)"
        cdkDropList
      >
        <i style="color: gray" class="fa fa-2x fa-cloud-upload"></i>
        <p>Drag and drop your file here</p>
        <p>or</p>
        <button mat-raised-button (click)="fileInput.click()">
          Select File
        </button>
        <input
          [multiple]="false"
          style="display: none"
          (change)="onFileSelected($event)"
          #fileInput
          type="file"
          accept=".csv"
        />
        <br />
        <br />
        <span *ngIf="selectedFile">
          <i class="fa fa-close" style="color: gray" (click)="removeFile()"></i>
          File selected:
          <a
            ><b style="font-weight: 500">{{ selectedFile.name }}</b></a
          >
          &nbsp;<i class="fa fa-check-circle" style="color: #32a50f"></i>
        </span>

        <mat-error style="text-align: center" *ngIf="validationError"
          ><i class="fa fa-times-circle" style="color: #ff052b">
            {{ validationError }}</i
          ></mat-error
        >
      </div>
      <br />
      <div style="text-align: center" *ngIf="fileSelected">
        <button
          class="btn btn-primary"
          mat-stroked-button
          (click)="uploadCLODataFile(dialogTemplate)"
          style="color: white"
        >
          Upload
        </button>
      </div>
    </mat-tab>
    <mat-tab label="Enter CLO Updates">
      <br />
      <form [formGroup]="updateForm">
        <mat-form-field appearance="outline">
          <mat-label>Program Name</mat-label>
          <input
            matInput
            formControlName="programName"
            placeholder="Enter Program Name"
            name="programName"
            required
          />
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Account</mat-label>
          <input
            matInput
            formControlName="account"
            placeholder="Enter Account"
            name="account"
            required
          />
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Deal Id</mat-label>
          <input
            matInput
            formControlName="dealIds"
            placeholder="Enter Deal Ids"
            name="dealIds"
            required
          />
        </mat-form-field>
        <mat-form-field appearance="outline">
          <mat-label>Order/ Subscription number</mat-label>
          <input
            matInput
            formControlName="orderNum"
            placeholder="Enter Order Number"
            name="orderNum"
          />
        </mat-form-field>
        <mat-form-field floatLabel="auto">
          <input
            matInput
            formControlName="invoiceDate"
            [matDatepicker]="picker"
            placeholder="Invoice Eligible Date"
            [min]="currentDate"
            [readonly]="true"
            class="calendarInput"
          />
          <mat-datepicker-toggle
            matSuffix
            [for]="picker"
          ></mat-datepicker-toggle>
          <mat-datepicker #picker> </mat-datepicker>
        </mat-form-field>
        <mat-form-field appearance="outline">
          <mat-label>CLO Updates</mat-label>
          <input
            matInput
            formControlName="cloComments"
            placeholder="Enter Clo Updates"
            name="cloComments"
          />
        </mat-form-field>
      </form>
      <br />
      <div style="text-align: center">
        <button
          mat-stroked-button
          class="btn btn-primary"
          type="submit"
          (click)="submitCLOData(dialogTemplate)"
          style="background-color: gray; color: white"
        >
          Upload
        </button>
      </div>
    </mat-tab>
  </mat-tab-group>
  <br />
</div>

<div style="display: flex; justify-content: space-between; align-items: end">
  <ng-template #dialogTemplate>
    <br />
    <h6>
      <span *ngIf="uploadText === 'CLO Data upload failed!'"
        ><i class="fa fa-times-circle fa-lg" style="color: #ff052b"></i
      ></span>
      <span *ngIf="uploadText === 'CLO Data upload successful!'"
        ><i class="fa fa-check-circle fa-lg" style="color: #32a50f"></i
      ></span>
      <b style="font-weight: 500">&nbsp;{{ uploadText }}</b>
    </h6>
    <br />
    <div style="text-align: center">
      <button
        class="btn btn-primary"
        mat-stroked-button
        (click)="closeOkDialog()"
      >
        Ok
      </button>
    </div>
  </ng-template>
</div>
