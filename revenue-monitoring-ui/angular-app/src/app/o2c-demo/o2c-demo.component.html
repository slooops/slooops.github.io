<div class="slider-bar">
  <div *ngFor="let step of formattedAccrualsSteps; let i = index">
    <div class="circle-wrapper-loop">
      <p class="circle-caption-loop">{{ step.label }}</p>
      <p class="circle-loop"></p>
      <p class="circle-subcaption">Total Impact: {{ step.impact }}</p>
    </div>

    <div
      *ngIf="i < formattedAccrualsSteps.length - 1"
      class="chevron-wrapper-loop"
    >
      <div class="chevron"></div>
      <div class="chevron-white"></div>
    </div>
  </div>
</div>
