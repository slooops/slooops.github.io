<div
  style="
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
  "
>
  <h4 style="font-weight: 600; padding-top: 2vh">SBP Summary Data</h4>
  <div style="display: flex; gap: 1vh">
    <button
      mat-icon-button
      (click)="
        exportTableToExcel(
          sbpData.data,
          'ROL Transaction Data',
          'ROL_Transaction_Data'
        )
      "
    >
      <i class="fa fa-download"></i>
    </button>
  </div>
</div>

<div style="margin-top: 1vh">
  <ng-container *ngIf="sbpData?.data?.length">
    <div style="overflow-x: auto; padding-bottom: 100px">
      <table mat-table [dataSource]="sbpData" style="width: 100%">
        <ng-container *ngFor="let column of displayedColumns">
          <ng-container [matColumnDef]="column">
            <th mat-header-cell *matHeaderCellDef>{{ column }}</th>
            <td mat-cell *matCellDef="let element">{{ element[column] }}</td>
          </ng-container>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
      </table>
    </div>
  </ng-container>
  <ng-container *ngIf="!sbpData?.data?.length">
    <div class="loading-container">
      <app-loading-symbol></app-loading-symbol>
      <br /><br /><br />
    </div>
  </ng-container>
</div>
