<div class="grid-1 container">
  <div
    style="
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: -32px;
    "
  >
    <p class="section-title">SBP Summary Data</p>
    <div style="display: flex; gap: 1vh">
      <i
        (click)="
          exportTableToExcel(
            sbpData.data,
            'ROL Transaction Data',
            'ROL_Transaction_Data'
          )
        "
        class="fa fa-download"
      ></i>
    </div>
  </div>

  <div style="margin-top: 1vh">
    <ng-container *ngIf="sbpData?.data?.length">
      <div style="overflow-x: auto">
        <table mat-table [dataSource]="sbpData" style="width: 100%">
          <ng-container *ngFor="let column of displayedColumns">
            <ng-container [matColumnDef]="column">
              <th mat-header-cell *matHeaderCellDef>
                {{ replaceUnderscore(column) }}
              </th>

              <td mat-cell *matCellDef="let element">
                <!-- If column is OPERATING_UNIT, remove underscores in data -->
                <ng-container
                  *ngIf="column === 'OPERATING_UNIT'; else defaultCell"
                >
                  {{ replaceUnderscore(element[column]) }}
                </ng-container>
                <ng-template #defaultCell>
                  {{ element[column] }}
                </ng-template>
              </td>
            </ng-container>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
        </table>
      </div>
    </ng-container>
    <ng-container *ngIf="!sbpData?.data?.length">
      <div class="loading-container">
        <app-loading-symbol></app-loading-symbol>
        <br /><br /><br />
      </div>
    </ng-container>
  </div>
</div>
