<mat-tab-group [selectedIndex]="0">
  <mat-tab [label]="totalCases + ' Cases - AIT Case Analyzer'">
    <div class="charts-row">
      <div class="chart-section">
        <div class="chart-header-row">
          <h4>Category - {{ categoryAccuracy }}%</h4>
          <div class="flex-row header-metrics">
            <mat-icon>expand_content</mat-icon>
          </div>
        </div>

        <div class="chart-container">
          <app-bar-chart
            [data]="i2cChartData"
            [stacked]="true"
            [isLoading]="false"
            canvasId="aitStackedChart"
          >
          </app-bar-chart>
        </div>
      </div>
      <div class="chart-section">
        <div class="chart-header-row">
          <h4>Core Issue - {{ coreIssueAccuracy }}%</h4>
          <div class="flex-row header-metrics">
            <mat-icon>expand_content</mat-icon>
          </div>
        </div>

        <div class="chart-container">
          <app-bar-chart
            [data]="i2cSimpleChartData"
            [stacked]="true"
            [isLoading]="false"
            canvasId="aitSimpleChart"
          >
          </app-bar-chart>
        </div>
      </div>
    </div>

    <div class="metric-box">
      <h4>AIT Classification Summary</h4>

      <p>
        Note: Use the Upload button to submit and validate the data for
        accuracy. Default filter applied to display for category match or core
        issue match is N or NULL
      </p>
    </div>

    <app-caseiq-table
      #aitTable
      [dataSource]="i2cTableData"
      [displayedColumns]="i2cTableColumns"
      [exportFileName]="'AIT_Validation_Summary'"
      [extraWideColumns]="['Case Summary - Description']"
      [enablePagination]="true"
      [pageSize]="10"
      [totalRecords]="totalRecords"
    >
    </app-caseiq-table>
  </mat-tab>
</mat-tab-group>
