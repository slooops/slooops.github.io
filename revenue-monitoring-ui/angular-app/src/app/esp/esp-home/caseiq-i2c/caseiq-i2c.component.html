<div class="charts-row">
  <div class="chart-section">
    <div class="chart-header-row">
      <h4>Category - {{ categoryAccuracy }}%</h4>
      <div class="flex-row header-metrics">
        <mat-icon
          (click)="onExpandChart('CATEGORY')"
          (keyup.enter)="onExpandChart('CATEGORY')"
          tabindex="0"
          class="expand-icon"
          title="Expand Category Chart"
          style="cursor: pointer"
          >expand_content</mat-icon
        >
      </div>
    </div>

    <div class="chart-container">
      <app-bar-chart
        [data]="i2cChartData"
        [stacked]="true"
        [isLoading]="false"
        canvasId="i2cStackedChart"
      >
      </app-bar-chart>
    </div>
  </div>
  <div class="chart-section">
    <div class="chart-header-row">
      <h4>Core Issue - {{ coreIssueAccuracy }}%</h4>
      <div class="flex-row header-metrics">
        <mat-icon
          (click)="onExpandChart('CORE_ISSUE')"
          (keyup.enter)="onExpandChart('CORE_ISSUE')"
          tabindex="0"
          class="expand-icon"
          title="Expand Core Issue Chart"
          style="cursor: pointer"
          >expand_content</mat-icon
        >
      </div>
    </div>

    <div class="chart-container">
      <app-bar-chart
        [data]="i2cSimpleChartData"
        [stacked]="true"
        [isLoading]="false"
        canvasId="i2cSimpleChart"
      >
      </app-bar-chart>
    </div>
  </div>
</div>

<div class="metric-box">
  <h4>I2C Classification Summary</h4>

  <p>
    Note: Changes made in the table below are not saved automatically. Please
    download your edits and use the sidebar 'Update Dashboard Data' option to
    persist changes.
  </p>
</div>

<app-caseiq-table
  #i2cTable
  [dataSource]="i2cTableData"
  [displayedColumns]="i2cTableColumns"
  [exportFileName]="'I2C_Validation_Summary'"
  [extraWideColumns]="['Case Summary - Description']"
  [enablePagination]="true"
  [pageSize]="10"
  [totalRecords]="totalRecords"
  [source]="'i2c'"
>
</app-caseiq-table>
