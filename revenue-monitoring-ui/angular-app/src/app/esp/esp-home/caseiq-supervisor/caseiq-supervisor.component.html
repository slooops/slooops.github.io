@if (!selectedIncident) {
  <app-caseiq-incidents
    (sharedStateOpen)="onSharedStateOpen($event)"
  ></app-caseiq-incidents>
}

<app-caseiq-incident-detail
  [incident]="selectedIncident"
  backLabel="Back to Orchestrator"
  (back)="onBackFromDetail()"
  [style.display]="selectedIncident ? 'block' : 'none'"
></app-caseiq-incident-detail>
