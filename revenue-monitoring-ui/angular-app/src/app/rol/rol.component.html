<div
  style="
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
  "
>
  <h4 style="font-weight: 600; padding: 0.8vh 1.5vh 0vh 1.5vh">
    ROL Error Summary Data
  </h4>
  <div style="display: flex; gap: 1vh">
    <button
      mat-icon-button
      (click)="
        exportTableToExcel(
          rolErrorSummaryData.data,
          'ROL Error Summary Data',
          'ROL_Error_Summary_Data'
        )
      "
    >
      <i class="fa fa-download"></i>
    </button>
  </div>
</div>

<div>
  <ng-container *ngIf="rolErrorSummaryData?.data?.length">
    <table
      mat-table
      [dataSource]="rolErrorSummaryData"
      style="width: 100%; overflow-x: auto"
    >
      <ng-container *ngFor="let column of rolErrorDisplayedColumns">
        <ng-container [matColumnDef]="column">
          <th mat-header-cell *matHeaderCellDef>{{ column }}</th>
          <td mat-cell *matCellDef="let element">{{ element[column] }}</td>
        </ng-container>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="rolErrorDisplayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: rolErrorDisplayedColumns"></tr>
    </table>
  </ng-container>
  <div style="display: flex; justify-content: center"></div>

  <ng-container *ngIf="!rolErrorSummaryData?.data?.length">
    <div class="loading-container">
      <app-loading-symbol></app-loading-symbol>
      <br /><br /><br />
    </div>
  </ng-container>
</div>
