<div class="modal-overlay" (click)="closeDialog('cancel')">
  <div class="modal-content container" (click)="$event.stopPropagation()">
    <div
      style="
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        width: 100%;
        gap: 16px;
      "
    >
      <h5 class="section-title">Assign User</h5>
      <i
        class="svg-icon close-icon"
        (click)="closeDialog('cancel')"
        style="cursor: pointer"
      ></i>
    </div>

    <div class="modal-body">
      <form [formGroup]="updateForm" class="form-stack">
        <div class="input-stack" *ngFor="let field of disabledFields">
          <label>{{ field.label }}</label>
          <input
            type="text"
            [formControlName]="field.controlName"
            [attr.disabled]="true"
            [placeholder]="'Enter ' + field.label"
          />
        </div>

        <div class="input-stack" *ngFor="let field of enabledFields">
          <label>{{ field.label }}</label>
          <ng-container *ngIf="field.controlName === 'assignedTo'">
            <select [formControlName]="field.controlName">
              <option value="" disabled selected hidden>Select User</option>
              <option *ngFor="let data of availableNames" [value]="data.name">
                {{ data.name }}
              </option>
            </select>
          </ng-container>
          <ng-container *ngIf="field.controlName !== 'assignedTo'">
            <input
              type="text"
              [formControlName]="field.controlName"
              [placeholder]="'Enter ' + field.label"
            />
          </ng-container>
        </div>
      </form>
    </div>

    <div class="modal-footer">
      <button class="custom-button-tertiary" (click)="closeDialog('cancel')">
        Cancel
      </button>
      <button class="custom-button-primary" (click)="submitData()">Save</button>
    </div>
  </div>
</div>
