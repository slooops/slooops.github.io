<!-- Modal Overlay -->
<div class="modal-overlay" (click)="closeDialog(null)">
  <!-- Modal Content -->
  <div class="modal-content container" (click)="$event.stopPropagation()">
    <!-- Modal Header -->
    <div
      style="
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        width: 100%;
        gap: 16px;
      "
    >
      <h5 class="section-title">Assign User</h5>
      <i class="svg-icon close-icon" (click)="closeDialog(null)"></i>
    </div>

    <!-- Modal Body -->
    <div class="modal-body">
      <form [formGroup]="updateForm" class="form-stack">
        <!-- Disabled Fields -->
        <div class="input-stack" *ngFor="let field of disabledFields">
          <label>{{ field.label }}</label>
          <input
            type="text"
            [formControlName]="field.controlName"
            [attr.disabled]="true"
            [placeholder]="'Enter ' + field.label"
          />
        </div>

        <!-- Enabled Fields -->
        <div class="input-stack" *ngFor="let field of enabledFields">
          <label>{{ field.label }}</label>
          <input
            type="text"
            [formControlName]="field.controlName"
            [placeholder]="'Enter ' + field.label"
          />
        </div>
      </form>
    </div>

    <!-- Modal Footer/Actions -->
    <div class="modal-footer">
      <button class="custom-button-tertiary" (click)="closeDialog(null)">
        Cancel
      </button>
      <button class="custom-button-primary" (click)="submitData()">Save</button>
    </div>
  </div>
</div>
