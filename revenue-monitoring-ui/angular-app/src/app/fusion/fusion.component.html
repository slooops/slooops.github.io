<app-monitoring-dashboard
  [urls]="fusionUrls"
  [keysToMap]="preAndAutoInvoiceKeysToMap"
  [processFlowKeys]="fusionTotals"
  [periodStatus]="periodStatus"
  [componentName]="'Fusion'"
  [processFlowTabsToDisplay]="['Fusion']"
  [specialWords]="specialWords"
  [skippedWords]="skippedWords"
  [dynamicTemplate]="fusionTemplate"
  [dynamicCss]="fusionprocessflowCss"
  [isSubAppMapping]="false"
  [warningMessage]="'Warning message '"
  [columnsToFilter]="fusionFilters"
  [detailsColumnsToHide]="['TRANSACTION_DATE']"
  [submitKeysToMap]="[
    'PERIOD_NAME',
    'PROCESS_FLOW',
    'ORG_NAME',
    'TRANSACTION_DATE'
  ]"
  [webexKeysToMap]="[
    'PERIOD_NAME',
    'APPLICATION_NAME',
    'PROCESS_FLOW',
    'ORG_NAME',
    'TRANSACTION_DATE',
    'AMOUNT'
  ]"
></app-monitoring-dashboard>
<ng-template #fusionTemplate let-allTotals="allTotals">
  <div class="flowchart-container">
    <div class="slider-bar">
      <div *ngFor="let step of formattedFusionSteps; let i = index">
        <div class="circle-wrapper-loop">
          <p class="circle-caption-loop">{{ step.label }}</p>
          <p class="circle-loop"></p>
          <p class="circle-subcaption">
            Total Impact:
            {{ allTotals['Fusion']?.[step.impact] || 'N/A' }}
          </p>
        </div>

        <div
          *ngIf="i < formattedFusionSteps.length - 1"
          class="chevron-wrapper-loop"
        >
          <div class="chevron"></div>
          <div class="chevron-white"></div>
        </div>
      </div>
    </div>
  </div>
</ng-template>

<div
  style="display: flex; justify-content: center; align-items: center !important"
>
  <ng-container *ngIf="!roles.length">
    <tr>
      <td colspan="100%" style="text-align: center">
        <app-loading-symbol></app-loading-symbol>
      </td>
    </tr>
  </ng-container>
</div>
