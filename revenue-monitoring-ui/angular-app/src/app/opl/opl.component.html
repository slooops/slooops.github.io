<br />
<div>
  <div class="container rol-error-summary-container">
    <div class="header-container">
      <h5 class="section-title action-buttons">OPL Data</h5>
    </div>

    <ng-container *ngIf="dataSource?.data?.length">
      <div
        class="table table-responsive table-container"
        style="overflow-y: hidden !important"
      >
        <table
          mat-table
          [dataSource]="dataSource"
          class="custom-table table-responsive"
        >
          <ng-container *ngFor="let column of displayedColumns">
            <ng-container [matColumnDef]="column">
              <th mat-header-cell *matHeaderCellDef class="nowrap no-wrap">
                <ng-container [ngSwitch]="column">
                  <ng-container *ngSwitchDefault>
                    {{ column }}
                  </ng-container>
                </ng-container>
              </th>

              <td mat-cell *matCellDef="let element">
                <ng-container [ngSwitch]="column">
                  <!-- Format Dates if Column is a Date -->
                  <ng-container *ngSwitchCase="'crDt'">
                    {{ element[column] | date : "yyyy-MM-dd" }}
                  </ng-container>
                  <ng-container *ngSwitchCase="'eventTm'">
                    {{ element[column] | date : "yyyy-MM-dd" }}
                  </ng-container>
                  <ng-container *ngSwitchCase="'processCrDt'">
                    {{ element[column] | date : "yyyy-MM-dd" }}
                  </ng-container>
                  <ng-container *ngSwitchCase="'processUpdDt'">
                    {{ element[column] | date : "yyyy-MM-dd" }}
                  </ng-container>
                  <ng-container *ngSwitchCase="'updDt'">
                    {{ element[column] | date : "yyyy-MM-dd" }}
                  </ng-container>

                  <!-- Default Case (Non-Date Columns) -->
                  <ng-container *ngSwitchDefault>
                    {{ element[column] }}
                  </ng-container>
                </ng-container>
              </td>
            </ng-container>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
        </table>
      </div>
    </ng-container>
  </div>
</div>
