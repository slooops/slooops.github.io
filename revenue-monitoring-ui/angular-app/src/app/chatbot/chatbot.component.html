<!-- Collapsed launcher tab -->
@if (!isOpen) {
  <button class="chat-launcher" (click)="onToggle()" title="Open Assistant">
    <img
      src="assets/icons/Circuit-Logo.png"
      alt="Assistant"
      class="launcher-icon"
    />
  </button>
}

<!-- Expanded panel -->
@if (isOpen) {
  <div
    class="chat-panel"
    [style.width.px]="panelWidth"
    [style.height.px]="panelHeight"
  >
    <!-- Resize handles -->
    <div
      class="resize-handle resize-left"
      (mousedown)="onResizeStart($event, 'left')"
    ></div>
    <div
      class="resize-handle resize-top"
      (mousedown)="onResizeStart($event, 'top')"
    ></div>
    <div
      class="resize-handle resize-top-left"
      (mousedown)="onResizeStart($event, 'top-left')"
    ></div>

    <!-- Header -->
    <div class="chat-header">
      <div class="chat-header-left">
        <div class="chat-avatar">
          <img
            src="assets/icons/Circuit-Logo.png"
            alt="Circuit"
            class="avatar-img"
          />
        </div>
        <div class="chat-header-info">
          <span class="chat-header-title">Control Tower Assistant</span>
          <span class="chat-header-subtitle"
            >Powered by <span class="circuit-brand">CIRCUIT</span></span
          >
        </div>
      </div>
      <button
        class="chat-close-btn"
        (click)="onToggle()"
        title="Close Assistant"
      >
        <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
          <path
            d="M12.854 3.146a.5.5 0 0 0-.708 0L8 7.293 3.854 3.146a.5.5 0 1 0-.708.708L7.293 8l-4.147 4.146a.5.5 0 0 0 .708.708L8 8.707l4.146 4.147a.5.5 0 0 0 .708-.708L8.707 8l4.147-4.146a.5.5 0 0 0 0-.708z"
          />
        </svg>
      </button>
    </div>

    <!-- Messages area -->
    <div class="chat-body" #messagesContainer>
      @for (msg of messages; track $index) {
        <div
          class="chat-msg"
          [class.user]="msg.isUser"
          [class.bot]="!msg.isUser"
        >
          @if (!msg.isUser) {
            <div class="msg-avatar-sm">
              <img
                src="assets/icons/Circuit-Logo.png"
                alt=""
                class="msg-avatar-img"
              />
            </div>
          }
          <div class="msg-bubble" [class.welcome]="msg.isWelcome">
            {{ msg.text }}
          </div>
        </div>
      }

      <!-- Typing indicator -->
      @if (isLoading) {
        <div class="chat-msg bot">
          <div class="msg-avatar-sm">
            <img
              src="assets/icons/Circuit-Logo.png"
              alt=""
              class="msg-avatar-img"
            />
          </div>
          <div class="msg-bubble typing-indicator">
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
          </div>
        </div>
      }
    </div>

    <!-- Persistent suggestion chips -->
    <div class="chat-suggestions">
      <div class="suggestions-chips">
        @for (chip of config.suggestions; track chip) {
          <button
            class="suggestion-chip"
            (click)="onSuggestionClick(chip)"
            [disabled]="isLoading"
          >
            {{ chip }}
          </button>
        }
      </div>
    </div>

    <!-- Input area -->
    <div class="chat-footer">
      <div class="chat-input-row">
        <form class="chat-form" (ngSubmit)="sendMessage()">
          <input
            class="chat-input"
            [(ngModel)]="newMessage"
            name="message"
            placeholder="Ask a question..."
            autocomplete="off"
          />
          @if (isLoading) {
            <button
              class="chat-stop-btn"
              type="button"
              (click)="cancelRequest()"
              title="Stop"
            >
              <svg
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="currentColor"
              >
                <rect x="6" y="6" width="12" height="12" rx="2" />
              </svg>
            </button>
          } @else {
            <button
              class="chat-send-btn"
              type="submit"
              [disabled]="!newMessage?.trim()"
              title="Send"
            >
              <svg
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="currentColor"
              >
                <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z" />
              </svg>
            </button>
          }
        </form>
      </div>
      <!-- <div class="chat-footer-note">
        Powered by Control Tower Support Agent · CIRCUIT
      </div> -->
    </div>
  </div>
}
