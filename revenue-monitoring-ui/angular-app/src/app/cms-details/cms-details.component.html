<div
  style="
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
  "
>
  <h4 style="font-weight: 600; padding: 0.8vh 1.5vh 0vh 1.5vh">
    Invoice Extract Errors
  </h4>
  <div style="display: flex; gap: 1vh">
    <button
      mat-icon-button
      (click)="
        exportTableToExcel(
          invoiceExtractErrData.data,
          'Invoice Extract Errors',
          'Invoice_Extract_Errors'
        )
      "
    >
      <i class="fa fa-download"></i>
    </button>
  </div>
</div>

<div class="arclosetable">
  <!-- Invoice Extract Error Table -->
  <ng-container *ngIf="invoiceExtractErrData?.data?.length">
    <table
      mat-table
      [dataSource]="invoiceExtractErrData"
      class="arclosetable"
      style="width: 100%; overflow-x: auto"
    >
      <!-- Dynamic Columns -->
      <ng-container *ngFor="let column of invoiceExtractErrDisplayedColumns">
        <ng-container [matColumnDef]="column">
          <th mat-header-cell *matHeaderCellDef>{{ column }}</th>
          <td mat-cell *matCellDef="let element">{{ element[column] }}</td>
        </ng-container>
      </ng-container>

      <!-- Header and Row Declarations -->
      <tr
        mat-header-row
        *matHeaderRowDef="invoiceExtractErrDisplayedColumns"
      ></tr>
      <tr
        mat-row
        *matRowDef="let row; columns: invoiceExtractErrDisplayedColumns"
      ></tr>
    </table>
  </ng-container>
  <div style="display: flex; justify-content: center"></div>

  <ng-container *ngIf="!invoiceExtractErrData?.data?.length">
    <div class="loading-container">
      <app-loading-symbol></app-loading-symbol>
      <br /><br /><br />
    </div>
  </ng-container>
</div>
