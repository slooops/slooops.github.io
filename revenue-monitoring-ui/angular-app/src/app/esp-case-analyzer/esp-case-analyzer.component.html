<mat-tab-group
  (selectedTabChange)="onTabClick($event)"
  [selectedIndex]="selectedTabIndex"
>
  <mat-tab *ngIf="q1 && q2" [label]="'Q1 - Q2'" [disabled]="!(q1 && q2)">
    <p
      class="card-subtitle"
      style="
        display: flex;
        justify-content: flex-end;
        font-size: 10px;
        margin: 2px 1.5rem -1rem 0px;
        font-weight: 600;
        font-size: 12px;
      "
    >
      Data for {{ q1 }} and {{ q2 }}
    </p>
    <div class="grid-2" style="margin: 0 12px">
      <div class="card">
        <div class="chart-canvas">
          <app-loading-symbol *ngIf="isQ1Q2Loading"></app-loading-symbol>
          <canvas id="birChartQ1Q2"></canvas>
        </div>
      </div>

      <div class="card">
        <div class="chart-canvas">
          <app-loading-symbol *ngIf="isQ1Q2Loading"></app-loading-symbol>
          <canvas id="prmcChartQ1Q2"></canvas>
        </div>
      </div>
    </div>

    <!-- Previous Quarter Table -->
    <app-table
      title="Case Summary for {{ q2?.slice(0, -4) }}"
      [dataSource]="dataSourceCaseSummaryQuarter[2]"
      [displayedColumns]="displayedColumnsForCaseSummaryQuarter[2]"
      exportFileName="Previous_Quarter_Case_Summary"
      reportLink="https://cisco.sharepoint.com/sites/InvoiceToCashITI2C/I2C%20and%20Rev%20Operate%20and%20Maintain/Forms/AllItems.aspx?newTargetListUrl=%2Fsites%2FInvoiceToCashITI2C%2FI2C%20and%20Rev%20Operate%20and%20Maintain&viewpath=%2Fsites%2FInvoiceToCashITI2C%2FI2C%20and%20Rev%20Operate%20and%20Maintain%2FForms%2FAllItems%2Easpx&id=%2Fsites%2FInvoiceToCashITI2C%2FI2C%20and%20Rev%20Operate%20and%20Maintain%2FWeekly%20ESP%20Case%20Report&viewid=f061e706%2Dfd9d%2D4b4c%2Da779%2D411e9290e79c
      "
      serviceNowLink="https://cisco.service-now.com/nav_to.do?uri=%2F$pa_dashboard.do%3Fsysparm_dashboard%3D6e2f7f0adbcf3340a89e96f8db96193a"
      [extraWideColumns]="['SERVICE_OFFERING']"
    ></app-table>

    <app-table
      title=" Aging Backlog for {{ q2?.slice(0, -4) }}"
      [dataSource]="dataSourceAgingBacklog[2]"
      [displayedColumns]="displayedColumnsForAgingBacklog[2]"
      exportFileName="Previous_Quarter_Aging_Backlog"
      [extraWideColumns]="['SERVICE_OFFERING']"
    ></app-table>

    <br /><br /><br />
  </mat-tab>

  <mat-tab *ngIf="q2 && q3" [label]="'Q2 - Q3'" [disabled]="!(q2 && q3)">
    <p
      class="card-subtitle"
      style="

        font-size: 10px;
        margin: 2px 1.5rem -1rem 0px;

    <div
      style="
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 400px;
        width: 100%;
      "
    >
      <app-loading-symbol></app-loading-symbol>
    </div>
  </mat-tab>
  <mat-tab *ngIf="!q2 || !q3" [label]="'Q2 - Q3'" [disabled]="true"> </mat-tab>
  <mat-tab *ngIf="!q3 || !q4" [label]="'Q3 - Q4'" [disabled]="true"> </mat-tab>
