<div class="dashboard-header">
  <div class="header-main">
    <div class="header-left">
      <div class="grid-menu-wrapper" (click)="$event.stopPropagation()">
        <img
          src="assets/icons/hamburger-menu.svg"
          alt="menu"
          class="grid-menu-icon"
          (click)="toggleGridMenu($event)"
        />
        @if (showGridMenu) {
          <div class="grid-menu-dropdown">
            <div class="grid-menu-item active" (click)="showGridMenu = false">
              <span class="grid-menu-item-name">General Ledger</span>
            </div>
          </div>
        }
      </div>
      <h2>General Ledger</h2>
    </div>

    <div class="period-info" *ngIf="periodStatus as period">
      <span><b>Period name:</b> {{ period.periodName }} &nbsp;</span>
      <span class="divider"> | </span>
      <span
        >&nbsp;<b>Period end date:</b> {{ period.periodEndDate }} &nbsp;</span
      >
      <span class="divider"> | </span>
      <span>&nbsp;<b>Last Updated:</b> {{ period.lastUpdated }} &nbsp;</span>
    </div>

    <div class="global-search">
      <div class="global-search-input-wrapper">
        <input
          type="text"
          class="global-search-input"
          #globalSearchInput
          placeholder="Search.."
        />
      </div>
      <span class="global-search-icon">🔍</span>
    </div>
  </div>
</div>

<hr />

@if (roles.includes("ADMIN")) {
  <div class="gl-content">
    <app-monitoring-dashboard
      [urls]="glUrls"
      [keysToMap]="glKeysToMap"
      [componentName]="'General Ledger'"
      [columnsToFilter]="glFilters"
      [assignmentDialogFieldConfig]="fieldConfig"
      [userContext]="userContextData"
      [submitKeysToMap]="['GL_BATCH_NAME']"
      [webexKeysToMap]="['GL_BATCH_NAME']"
    ></app-monitoring-dashboard>
  </div>
}
