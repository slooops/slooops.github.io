<mat-tab-group>
  @if (roles.includes('ADMIN')) {
  <mat-tab label="General Ledger">
    <app-monitoring-dashboard
      [urls]="glUrls"
      [keysToMap]="glKeysToMap"
      [componentName]="'General Ledger'"
      [columnsToFilter]="glFilters"
      [assignmentDialogFieldConfig]="fieldConfig"
      [userContext]="userContextData"
      [submitKeysToMap]="[
        'LEDGER_NAME',
        'JOURNAL_SOURCE',
        'ACCOUNT_SEG',
        'APPLICATION_NAME',
        'TRANSACTION_DATE',
        'PROCESS_FLOW',
        'GL_BATCH_NAME'
      ]"
      [webexKeysToMap]="[
        'LEDGER_NAME',
        'JOURNAL_SOURCE',
        'ACCOUNT_SEG',
        'APPLICATION_NAME',
        'TRANSACTION_DATE',
        'PROCESS_FLOW'
      ]"
    ></app-monitoring-dashboard>
  </mat-tab>
  }
</mat-tab-group>
