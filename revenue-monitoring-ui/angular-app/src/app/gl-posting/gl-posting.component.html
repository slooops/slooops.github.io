<mat-tab-group>
  @if (roles.includes("ADMIN") || roles.includes("EXCEPTION_READ_ONLY")) {
    <mat-tab label="General Ledger">
      <app-monitoring-dashboard
        [urls]="glUrls"
        [keysToMap]="glKeysToMap"
        [componentName]="'General Ledger'"
        [columnsToFilter]="glFilters"
        [assignmentDialogFieldConfig]="fieldConfig"
        [userContext]="userContextData"
        [submitKeysToMap]="['GL_BATCH_NAME']"
        [webexKeysToMap]="['GL_BATCH_NAME']"
      ></app-monitoring-dashboard>
    </mat-tab>
  }
</mat-tab-group>
