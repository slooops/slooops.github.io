<h5 style="text-align: center; font-weight: bold">Standard Revenue</h5>
<app-monitoring-dashboard
  [urls]="standardRevenueUrl"
  [keysToMap]="[
    'PERIOD_NAME',
    'ORG_NAME',
    'APPLICATION_NAME',
    'PROCESS_FLOW',
    'TRANSACTION_DATE'
  ]"
  [processFlowKeys]="standardRevenueTotals"
  [periodStatus]="periodStatus"
  [componentName]="'Standard Revenue'"
  [processFlowTabsToDisplay]="['Standard Revenue']"
  [specialWords]="specialWords"
  [skippedWords]="skippedWords"
  [dynamicTemplate]="standardRevenueTemplate"
  [dynamicCss]="standardRevenueprocessflowCss"
  [isSubAppMapping]="false"
  [warningMessage]="'Displays message with impacted accounting information'"
  [columnsToFilter]="standardRevenueFilters"
  [detailsColumnsToHide]="['TRANSACTION_DATE']"
  [submitKeysToMap]="[
    'PERIOD_NAME',
    'APPLICATION_NAME',
    'PROCESS_FLOW',
    'ORG_NAME',
    'TRANSACTION_DATE'
  ]"
  [webexKeysToMap]="[
    'PERIOD_NAME',
    'APPLICATION_NAME',
    'PROCESS_FLOW',
    'ORG_NAME',
    'TRANSACTION_DATE',
    'AMOUNT'
  ]"
></app-monitoring-dashboard>

<ng-template #standardRevenueTemplate let-allTotals="allTotals">
  <div class="flowchart-container">
    <div class="slider-bar">
      <div *ngFor="let step of formatStandardRevenueSteps; let i = index">
        <div class="circle-wrapper-loop">
          <p class="circle-caption-loop">{{ step.label }}</p>
          <p class="circle-loop"></p>
          <p class="circle-subcaption">
            Total Impact:
            {{ allTotals['Standard Revenue']?.[step.impact] || 'N/A' }}
          </p>
        </div>

        <div
          *ngIf="i < formatStandardRevenueSteps.length - 1"
          class="chevron-wrapper-loop"
        >
          <div class="chevron"></div>
          <div class="chevron-white"></div>
        </div>
      </div>
    </div>
  </div>
</ng-template>

<div
  style="display: flex; justify-content: center; align-items: center !important"
>
  <ng-container *ngIf="!roles.length">
    <tr>
      <td colspan="100%" style="text-align: center">
        <app-loading-symbol></app-loading-symbol>
      </td>
    </tr>
  </ng-container>
</div>
