<mat-tab-group
  [selectedIndex]="selectedIndex"
  (selectedIndexChange)="onTabChange($event)"
>
  <mat-tab
    *ngFor="let tab of filteredTabs; let i = index"
    [label]="tab.label"
    [disabled]="tab.disabled"
  >
    <ng-container [ngSwitch]="tab.component">
      <ng-container *ngSwitchCase="'app-imports'">
        <app-monitoring-dashboard
          [urls]="omImportUrls"
          [keysToMap]="['timestamp', 'scenario']"
          [processFlowKeys]=""
          [periodStatus]="periodStatus"
          [componentName]="'Order Management Imports'"
          [processFlowTabsToDisplay]="[]"
          [specialWords]="specialWords"
          [skippedWords]="skippedWords"
          [dynamicTemplate]=""
          [dynamicCss]=""
          [isSubAppMapping]="false"
          [warningMessage]="'Warning message '"
          [columnsToFilter]="omImportFilters"
          [detailsColumnsToHide]="[]"
          [assignmentDialogFieldConfig]="fieldConfig"
          [submitKeysToMap]="['timestamp', 'scenario']"
          [webexKeysToMap]="[]"
          *ngIf="selectedIndex === i"
        ></app-monitoring-dashboard>
      </ng-container>
      <ng-container *ngSwitchCase="'app-holds'">
        <app-monitoring-dashboard
          [urls]="omHoldsUrls"
