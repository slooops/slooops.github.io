<div class="iu-dialog">
  <!-- Header -->
  <div class="iu-header">
    <h3 class="iu-header__title">File Upload</h3>
    <button class="iu-header__close" (click)="closeDialog('closed')">
      <ng-icon name="phosphorXBold" size="18" />
    </button>
  </div>

  <!-- Body -->
  <div class="iu-body">
    <!-- Download template -->
    <a
      class="iu-template-link"
      href="../../assets/Issue Resolution Template.xlsx"
      download
    >
      <ng-icon name="phosphorArrowLineDownBold" size="18" />
      Download Sample Template
    </a>

    <!-- Drop zone -->
    <div
      class="iu-dropzone"
      (drop)="onDrop($event)"
      (dragover)="onDragOver($event)"
      (click)="fileInput.click()"
    >
      <div class="iu-dropzone__icon">
        <ng-icon name="phosphorCloudArrowUpBold" size="36" />
      </div>
      <p class="iu-dropzone__text">Drag and drop your file here</p>
      <p class="iu-dropzone__or">or</p>
      <button
        type="button"
        class="iu-dropzone__btn"
        (click)="$event.stopPropagation(); fileInput.click()"
      >
        Select File
      </button>
      <input
        [multiple]="false"
        style="display: none"
        (change)="onFileSelected($event)"
        #fileInput
        type="file"
        accept=".xlsx, .xls, .csv"
      />
    </div>

    <!-- Selected file info -->
    @if (selectedFile) {
      <div class="iu-file-info">
        <ng-icon name="phosphorFileBold" size="20" class="iu-file-info__icon" />
        <span class="iu-file-info__name">{{ selectedFile.name }}</span>
        <ng-icon
          name="phosphorCheckCircleBold"
          size="18"
          class="iu-file-info__check"
        />
        <button
          type="button"
          class="iu-file-info__remove"
          (click)="removeFile()"
        >
          <ng-icon name="phosphorTrashBold" size="16" />
        </button>
      </div>
    }

    <!-- Upload button -->
    @if (fileSelected) {
      <button type="button" class="iu-upload-btn" (click)="uploadDealsFile()">
        <ng-icon name="phosphorCloudArrowUpBold" size="18" />
        Upload
      </button>
    }
  </div>
</div>
