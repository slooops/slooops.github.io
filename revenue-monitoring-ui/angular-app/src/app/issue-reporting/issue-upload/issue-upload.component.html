<div
  style="
    background-color: #00bceb;
    padding: 10px;
    color: white;
    display: flex;
    justify-content: space-between;
    align-items: center;
  "
>
  <!-- Title on the left -->
  <h5 style="margin: 0; font-weight: 450; font-size: 14px">File Upload</h5>

  <!-- Icons on the right (Download and Close) -->
  <a style="text-decoration: none; cursor: pointer">
    <i
      class="fa fa-close"
      style="font-size: 16px; color: white"
      (click)="closeDialog('closed')"
    ></i>
  </a>
</div>

<div style="padding: 20px">
  <div
    style="
      display: flex;
      justify-content: flex-end;
      align-items: center;
      margin-bottom: 20px;
    "
  >
    <a href="../../assets/Issue Resolution Template.xlsx" download
      ><i class="svg-icon download-icon" aria-hidden="true"></i>
      <span>&nbsp;Download Sample Template</span>
    </a>
  </div>
  <div
    class="file-drop-zone"
    (drop)="onDrop($event)"
    (dragover)="onDragOver($event)"
    cdkDropList
  >
    <i style="color: gray" class="fa fa-2x fa-cloud-upload"></i>
    <p>Drag and drop your file here</p>
    <p>or</p>
    <button mat-raised-button (click)="fileInput.click()">Select File</button>
    <input
      [multiple]="false"
      style="display: none"
      (change)="onFileSelected($event)"
      #fileInput
      type="file"
      accept=".xlsx, .xls, .csv"
    />
    <br />
    <br />
    @if (selectedFile) {
      <span>
        <i class="fa fa-close" style="color: gray" (click)="removeFile()"></i>
        File selected:
        <a
          ><b style="font-weight: 500">{{ selectedFile.name }}</b></a
        >
        &nbsp;<i class="fa fa-check-circle" style="color: #32a50f"></i>
      </span>
    }
  </div>
  @if (fileSelected) {
    <div style="text-align: center; margin-top: 20px">
      <button
        class="btn btn-primary"
        mat-stroked-button
        style="color: white"
        (click)="uploadDealsFile()"
      >
        Upload
      </button>
    </div>
  }
</div>
