<h5 class="bulk-title"><b>Approve / Reject</b></h5>

<div class="bulk-content">
  <table class="incident-table">
    <thead>
      <tr>
        <th>Incident</th>
        <th>Approve</th>
        <th>Reject</th>
      </tr>
    </thead>

    <tbody>
      @for (row of data; track row) {
        <tr>
          <td>{{ row.incidentNumber }}</td>
          <td>
            <input
              type="checkbox"
              [(ngModel)]="row.approved"
              (change)="onCheckboxChange(row, 'approve')"
            />
          </td>
          <td>
            <input
              type="checkbox"
              [(ngModel)]="row.rejected"
              (change)="onCheckboxChange(row, 'reject')"
            />
          </td>
        </tr>
      }
    </tbody>
  </table>
</div>

<div class="bulk-actions">
  <button
    class="btn"
    style="background-color: #185996 !important; color: white !important"
    (click)="onSubmit()"
  >
    Submit
  </button>
  <button
    class="btn btn-default"
    style="background-color: white !important"
    (click)="onCancel()"
  >
    Cancel
  </button>
</div>
