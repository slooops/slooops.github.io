<div class="filter-wrapper">
  <div class="dropdown" *ngIf="isOpen">
    <div
      class="dropdown-option"
      *ngFor="let opt of options"
      (click)="selectOption(opt)"
    >
      <mat-icon *ngIf="selectedOption === opt.value">check</mat-icon>
      {{ opt.label }}
    </div>
  </div>
</div>
