<div class="mm-wrapper" (click)="$event.stopPropagation()">
  <img
    src="assets/icons/hamburger-menu.svg"
    alt="menu"
    class="mm-icon"
    (click)="toggle($event)"
  />
  @if (open) {
    <div class="mm-dropdown">
      @for (item of items; track item.label; let i = $index) {
        <div
          class="mm-item"
          [class.active]="isActive(i, item)"
          [class.disabled]="item.disabled"
          (click)="select(i, item)"
        >
          <span class="mm-item-name">{{ item.label }}</span>
        </div>
      }
    </div>
  }
</div>
