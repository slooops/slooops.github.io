<div class="ms-wrapper">
  <!-- Level 1: Sidebar rail -->
  <div class="ms-rail" [class.collapsed]="collapsed">
    <!-- Toggle button -->
    <button class="ms-toggle" (click)="toggleSidebar()">
      <ng-icon name="phosphorListBold" size="20" />
      @if (!collapsed) {
        <span class="ms-toggle-label">Menu</span>
      }
    </button>

    <nav class="ms-nav">
      @for (item of navItems; track item.label) {
        @if (isVisible(item)) {
          <button
            class="ms-nav-item"
            [class.active]="
              activeDrawer === item.label ||
              isRouteActive(item.route) ||
              isParentActive(item)
            "
            [class.has-children]="!!item.children?.length"
            (click)="toggleDrawer(item)"
          >
            <ng-icon [name]="item.icon" size="20" class="ms-nav-icon" />
            @if (!collapsed) {
              <span class="ms-nav-label">{{ item.label }}</span>
              @if (item.children?.length) {
                <ng-icon
                  name="phosphorCaretRightBold"
                  size="14"
                  class="ms-nav-caret"
                  [class.open]="activeDrawer === item.label"
                />
              }
            }
          </button>
        }
      }
    </nav>
  </div>

  <!-- Collapse / expand toggle pill -->
  <button class="ms-collapse-pill" (click)="toggleSidebar()">
    <ng-icon
      name="phosphorCaretRightBold"
      size="16"
      class="ms-collapse-icon"
      [class.flipped]="!collapsed"
    />
  </button>

  <!-- Level 2: Drawer -->
  <div class="ms-drawer" [class.open]="activeDrawer !== null">
    @for (item of navItems; track item.label) {
      @if (item.children?.length && activeDrawer === item.label) {
        <div class="ms-drawer-content">
          <div class="ms-drawer-header">
            <span class="ms-drawer-title">{{ item.label }}</span>
            <button class="ms-drawer-close" (click)="activeDrawer = null">
              <ng-icon name="phosphorXBold" size="16" />
            </button>
          </div>
          <nav class="ms-drawer-nav">
            @for (child of getVisibleChildren(item); track child.label) {
              <button
                class="ms-drawer-item"
                [class.active]="isRouteActive(child.route)"
                (click)="navigateTo(child.route!)"
              >
                <ng-icon
                  [name]="child.icon"
                  size="18"
                  class="ms-drawer-item-icon"
                />
                <span class="ms-drawer-item-label">{{ child.label }}</span>
              </button>
            }
          </nav>
        </div>
      }
    }
  </div>
</div>
