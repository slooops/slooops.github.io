<div class="content-container">
  <div
    style="
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
    "
    >
    <h4 style="font-weight: 600; padding: 1.7vh 1.5vh 0vh 1.6vh">
      SFTP File Details
    </h4>
    <div style="display: flex; gap: 1vh">
      <button
        mat-icon-button
        (click)="
          exportTableToExcel(data, 'SFTP File Details', 'SFTP_File_Details')
        "
        >
        <i class="fa fa-download"></i>
      </button>
    </div>
  </div>

  @if (isDataLoaded) {
    <div class="table-container">
      <table mat-table [dataSource]="data" style="width: 100%; overflow-x: auto">
        <!-- Directory Column -->
        <ng-container matColumnDef="directory">
          <th mat-header-cell *matHeaderCellDef>Directory</th>
          <td mat-cell *matCellDef="let element">{{ element.directory }}</td>
        </ng-container>
        <!-- Extract Column -->
        <ng-container matColumnDef="extract">
          <th mat-header-cell *matHeaderCellDef>Extract</th>
          <td mat-cell *matCellDef="let element">{{ element.extract }}</td>
        </ng-container>
        <!-- File Name Column -->
        <ng-container matColumnDef="fileName">
          <th mat-header-cell *matHeaderCellDef>File Name</th>
          <td mat-cell *matCellDef="let element">{{ element.fileName }}</td>
        </ng-container>
        <!-- Time Stamp Column -->
        <ng-container matColumnDef="timeStamp">
          <th mat-header-cell *matHeaderCellDef>Timestamp</th>
          <td mat-cell *matCellDef="let element">
            {{ formatTimestamp(element.timeStamp) }}
          </td>
        </ng-container>
        <!-- Header and Row Declarations -->
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
      </table>
    </div>
  } @else {
    <div class="loading-container">
      <app-loading-symbol></app-loading-symbol>
      <br /><br /><br />
    </div>
  }

  @if (!this.data?.length && !loading) {
    <div class="loading-container">
      <div class="card-subtitle">No Data to Display</div>
      <br /><br /><br />
    </div>
  }
</div>
