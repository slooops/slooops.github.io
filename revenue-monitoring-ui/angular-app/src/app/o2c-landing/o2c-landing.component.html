<div
  class="o2c-container"
  style="justify-content: center; align-items: center; margin-top: 2vh"
>
  <div class="o2c-donut-row">
    <div class="chart-legend-wrapper">
      <div class="accordion">
        <div class="accordion-header" (click)="toggleAccordion(1)">
          <span>Donut Chart 1 Title</span>
          <span class="accordion-icon">{{ isOpen[1] ? "−" : "+" }}</span>
        </div>
        <div class="accordion-body" [class.open]="isOpen[1]">
          <app-o2c-donut
            [data]="dummyData1"
            canvasId="donutChart1"
          ></app-o2c-donut>
        </div>
      </div>
    </div>
