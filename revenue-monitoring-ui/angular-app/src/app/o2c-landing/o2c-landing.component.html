<div
  style="
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
    justify-content: flex-start;
    align-items: center;
    margin: 2vh 22px 0 22px;
  "
>
  <app-o2c-donut
    [data]="dummyData1"
    canvasId="donutChartLarge"
    [showCircleBackground]="false"
    [showLegend]="false"
    chartSize="150px"
  >
  </app-o2c-donut>

  <app-o2c-card
    [title]="'Order'"
    [count]="0"
    [value]="'0'"
    [footer]="'Enter to Booked'"
    [countDoubleWide]="0"
    [valueDoubleWide]="'0'"
    [footerDoubleWide]="'Booked to Fulfillment'"
  ></app-o2c-card>

  <app-o2c-card
    [title]="'Subscription'"
    [count]="0"
    [value]="'0'"
    [footer]="'Fulfillment to Invoicing'"
  ></app-o2c-card>

  <app-o2c-card
    [title]="'Invoice'"
    [count]="0"
    [value]="'0'"
    [footer]="'Fulfillment to Invoicing'"
  ></app-o2c-card>

  <app-o2c-card
    [title]="'Accounting'"
    [count]="0"
    [value]="'0'"
    [footer]="'Accounting'"
  ></app-o2c-card>

  <app-o2c-card
    [title]="'Cash'"
    [count]="0"
    [value]="'0'"
    [footer]="'Cash Collection'"
  ></app-o2c-card>
</div>

<div
  class="o2c-container"
  style="justify-content: center; align-items: center; margin-top: 2vh"
>
  <div class="o2c-donut-row">
    <app-o2c-accordion
      [title]="'Cisco Business Inclusion and Exclusion (BIE)'"
      [isOpen]="isOpen[1]"
      (toggleOpen)="toggleAccordion(1)"
    >
      <app-o2c-donut [data]="dummyData1" canvasId="donutChart1"></app-o2c-donut>
    </app-o2c-accordion>

    <app-o2c-accordion
      [title]="'Credit Holds'"
      [isOpen]="isOpen[2]"
      (toggleOpen)="toggleAccordion(2)"
    >
      <app-o2c-donut [data]="dummyData2" canvasId="donutChart2"></app-o2c-donut>
    </app-o2c-accordion>

    <app-o2c-accordion
      [title]="'Data Configuration'"
      [isOpen]="isOpen[3]"
      (toggleOpen)="toggleAccordion(3)"
    >
      <app-o2c-donut [data]="dummyData3" canvasId="donutChart3"></app-o2c-donut>
    </app-o2c-accordion>

    <app-o2c-accordion
      [title]="'Donut Chart 4 Title'"
      [isOpen]="isOpen[4]"
      (toggleOpen)="toggleAccordion(4)"
    >
      <app-o2c-donut [data]="dummyData4" canvasId="donutChart4"></app-o2c-donut>
    </app-o2c-accordion>

    <app-o2c-accordion
      [title]="'Process Exceptions'"
      [isOpen]="isOpen[5]"
      (toggleOpen)="toggleAccordion(5)"
    >
      <app-o2c-donut [data]="dummyData5" canvasId="donutChart5"></app-o2c-donut>
    </app-o2c-accordion>
  </div>
</div>
