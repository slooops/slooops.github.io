<div
  class="o2c-container"
  style="justify-content: center; align-items: center; height: 70vh"
>
  <div class="o2c-donut-row">
    <div class="chart-legend-wrapper">
      <div class="chart-container">
        <canvas id="donutChart1"></canvas>
      </div>

      <div class="custom-legend" *ngIf="legendMap['donutChart1']">
        <div *ngFor="let item of legendMap['donutChart1']" class="legend-item">
          <div class="legend-item">
            <div class="legend-left">
              <span
                class="legend-color-box"
                [style.background]="item.color"
              ></span>
              <span class="legend-type">{{ item.type }}</span>
            </div>
            <div class="legend-right">
              <span class="legend-count">{{ item.count }}</span>
              <span class="legend-value">{{ item.value | number }} M</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="chart-legend-wrapper">
      <div class="chart-container">
        <canvas id="donutChart2"></canvas>
      </div>

      <div class="custom-legend" *ngIf="legendMap['donutChart2']">
        <div *ngFor="let item of legendMap['donutChart2']" class="legend-item">
          <div class="legend-item">
            <div class="legend-left">
              <span
                class="legend-color-box"
                [style.background]="item.color"
              ></span>
              <span class="legend-type">{{ item.type }}</span>
            </div>
            <div class="legend-right">
              <span class="legend-count">{{ item.count }}</span>
              <span class="legend-value">{{ item.value | number }} M</span>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="chart-legend-wrapper">
      <div class="chart-container">
        <canvas id="donutChart3"></canvas>
      </div>

      <div class="custom-legend" *ngIf="legendMap['donutChart3']">
        <div *ngFor="let item of legendMap['donutChart3']" class="legend-item">
          <div class="legend-item">
            <div class="legend-left">
              <span
                class="legend-color-box"
                [style.background]="item.color"
              ></span>
              <span class="legend-type">{{ item.type }}</span>
            </div>
            <div class="legend-right">
              <span class="legend-count">{{ item.count }}</span>
              <span class="legend-value">{{ item.value | number }} M</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
