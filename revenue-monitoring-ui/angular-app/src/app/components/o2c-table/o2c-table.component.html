<div
  [class.header-table]="tableType === 'header'"
  [class.card]="tableType === 'body'"
  style="border-top: solid 1px #e0e0e0"
>
  <table mat-table [dataSource]="dataSource" class="gridded-table">
    <ng-container *ngFor="let column of displayedColumns">
      <ng-container [matColumnDef]="column">
        <!-- Header Row -->
        <th
          mat-header-cell
          [ngClass]="{
            'double-width': isWideColumn(column)
          }"
          *matHeaderCellDef
        >
          {{ removeUnderscores(column) }}
        </th>

        <!-- Data Row -->
        <td
          mat-cell
          *matCellDef="let element"
          [ngClass]="{
            'clickable-cell': isNavigableColumn(column),
            'double-width': isWideColumn(column)
          }"
          (click)="
            isNavigableColumn(column)
              ? navigateToRoute(column, element[column])
              : null
          "
        >
          {{ element[column] }}
        </td>
      </ng-container>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>
</div>
