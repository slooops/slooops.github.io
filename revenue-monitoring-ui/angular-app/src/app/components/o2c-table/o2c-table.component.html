<div style="padding-bottom: 0px">
  <table mat-table [dataSource]="dataSource" class="gridded-table">
    <ng-container *ngFor="let column of displayedColumns">
      <ng-container [matColumnDef]="column">
        <!-- Header Row (conditionally rendered inside tr, but column defs always exist) -->
        <th
          mat-header-cell
          *matHeaderCellDef
          [ngClass]="{
            'double-width': isWideColumn(column),
            'extra-wide': isExtraWideColumn(column)
          }"
        >
          {{ removeUnderscores(column) }}
        </th>

        <!-- Data Row -->
        <td
          mat-cell
          *matCellDef="let element"
          [ngClass]="{
            'clickable-cell': isNavigableColumn(column),
            'double-width': isWideColumn(column),
            'extra-wide': isExtraWideColumn(column),
            'green-text':
              (column === 'Order_Status' && element[column] === 'CLOSED') ||
              (column === 'Subscription_Status' && element[column] === 'ACTIVE')
          }"
          (click)="
            isNavigableColumn(column)
              ? navigateToRoute(column, element[column])
              : null
          "
        >
          {{ element[column] }}
        </td>
      </ng-container>
    </ng-container>

    <!-- Conditionally render the header row -->
    <ng-container *ngIf="showHeaderRow">
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    </ng-container>

    <!-- Always render the data rows -->
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>
</div>
