<div
  [class.card]="tableType === 'body'"
  [class.header-table]="tableType === 'header'"
  style="border-top: solid 1px #e4e4e4; border-bottom: solid 1px #e4e4e4"
>
  <table
    mat-table
    [dataSource]="dataSource"
    class="gridded-table"
    [class.header-table]="tableType === 'header'"
  >
    <ng-container *ngFor="let column of displayedColumns">
      <ng-container [matColumnDef]="column">
        <!-- Header Row -->
        <th
          mat-header-cell
          *matHeaderCellDef
          [ngClass]="{
            'double-width': isWideColumn(column),
            'extra-wide': isExtraWideColumn(column)
          }"
        >
          {{ removeUnderscores(column) }}
        </th>

        <!-- Data Row -->
        <td
          mat-cell
          *matCellDef="let element"
          [ngClass]="{
            'clickable-cell': isNavigableColumn(column),
            'double-width': isWideColumn(column),
            'extra-wide': isExtraWideColumn(column),
            'green-text':
              (column === 'Order_Status' && element[column] === 'CLOSED') ||
              (column === 'Subscription_Status' && element[column] === 'ACTIVE')
          }"
          (click)="
            isNavigableColumn(column)
              ? navigateToRoute(column, element[column])
              : null
          "
        >
          {{ element[column] }}
        </td>
      </ng-container>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>
</div>
