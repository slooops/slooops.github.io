<div class="table-header">
  <div class="search-and-filters">
    <div class="search-container">
      <input
        class="table-search"
        type="text"
        placeholder="Search table..."
        [(ngModel)]="searchTerm"
        (input)="onSearchChange($event)"
      />
    </div>

    <div class="filters-container">
      <button class="filters-btn" (click)="toggleFiltersDropdown($event)">
        <mat-icon style="height: 18px">filter_list</mat-icon> Filters (Coming
        Soon)
        <span class="filter-count" *ngIf="activeFilters.length > 0">{{
          activeFilters.length
        }}</span>
      </button>

      <!-- Filter Dropdown -->
      <div
        class="filters-dropdown"
        *ngIf="showFiltersDropdown"
        (click)="$event.stopPropagation()"
      >
        <div class="filter-sections">
          <div
            class="filter-section"
            *ngFor="let filterOption of filterOptions"
          >
            <div class="filter-section-title">{{ filterOption.label }}</div>
            <div class="filter-options">
              <label
                class="filter-option"
                *ngFor="let value of filterOption.values"
                [class.disabled]="isFilterDisabled(filterOption.id, value)"
              >
                <input
                  type="checkbox"
                  (change)="
                    addFilter(filterOption.id, filterOption.label, value)
                  "
                  [checked]="isFilterActive(filterOption.id, value)"
                  [disabled]="isFilterDisabled(filterOption.id, value)"
                />
                <span class="checkmark"></span>
                {{ value }}
              </label>
            </div>
          </div>
        </div>
      </div>
    </div>

    <span class="results-count"
      >{{ totalRecords || dataSource?.data?.length || 0 }} results</span
    >

    <button
      class="reset-btn"
      [class.disabled]="activeFilters.length === 0"
      [class.active]="activeFilters.length > 0"
      (click)="clearAllFilters()"
      [disabled]="activeFilters.length === 0"
    >
      Reset filters
    </button>

    <div class="filter-tags" *ngIf="activeFilters.length > 0">
      <div
        class="filter-tag"
        *ngFor="let filter of activeFilters; let i = index"
      >
        <span class="filter-label">{{ filter.label }}</span>
        <span class="filter-value">{{ filter.value }}</span>
        <button class="remove-filter" (click)="removeFilter(filter.id)">
          ✕
        </button>
      </div>
    </div>
  </div>

  <div class="table-links">
    <button class="btn-base" (click)="exportTableToExcel()">Download</button>
  </div>
</div>

<div style="margin-top: 1vh">
  <ng-container *ngIf="dataSource?.data?.length > 0">
    <div style="overflow-x: auto">
      <table mat-table [dataSource]="dataSource" style="width: 100%">
        <ng-container *ngFor="let column of filteredColumns">
          <ng-container [matColumnDef]="column">
            <th
              mat-header-cell
              *matHeaderCellDef
              [ngClass]="{
                'extra-wide-column': extraWideColumns.includes(column)
              }"
            >
              {{ removeUnderscores(column) }}
            </th>
            <td
              mat-cell
              *matCellDef="let element"
              [ngClass]="{
                'extra-wide-column': extraWideColumns.includes(column)
              }"
            >
              <ng-container
                *ngIf="
                  column.includes('TIME') || column.includes('DATE');
                  else defaultCell
                "
              >
                {{ element[column] | date : "MM/dd/yy" }}
              </ng-container>
              <ng-template #defaultCell>
                <!-- Special handling for Category and Core issue columns with stoplight indicators -->
                <ng-container
                  *ngIf="
                    column === 'Category' || column === 'Core issue';
                    else regularCell
                  "
                >
                  <div class="status-cell">
                    <span
                      class="status-circle"
                      [ngClass]="{
                        active: getMatchStatus(element, column) === 'Y',
                        inactive: getMatchStatus(element, column) !== 'Y'
                      }"
                    ></span>
                    {{ element[column] }}
                  </div>
                </ng-container>
                <ng-template #regularCell>{{ element[column] }}</ng-template>
              </ng-template>
            </td>
          </ng-container>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="filteredColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: filteredColumns"></tr>
      </table>
    </div>

    <!-- Paginator -->
    <mat-paginator
      *ngIf="enablePagination"
      #paginator
      [length]="totalRecords"
      [pageSize]="pageSize"
      [pageSizeOptions]="[5, 10, 25, 50, 100]"
      [showFirstLastButtons]="true"
      aria-label="Select page"
    >
    </mat-paginator>
  </ng-container>
  <ng-container *ngIf="!dataSource?.data?.length">
    <div class="loading-container">
      <app-loading-symbol></app-loading-symbol>
    </div>
  </ng-container>
</div>
