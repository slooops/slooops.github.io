        <h5
          style="
            color: white;
            margin-bottom: 0;
            font-family: 'Inter', sans-serif;
            font-weight: 450;
          "
        >
          <div>Operations Control Tower</div>
        </h5>
      </div>
      <div class="custom-search-bar">
        <input
          type="text"
          placeholder="Search Coming Soon..."
          class="custom-search-input"
        />
        <i class="svg-icon search-icon"></i>
      </div>

      <div style="display: flex; align-items: center">
        <i
          class="fa fa-question-circle"
          aria-hidden="true"
          style="
            color: white;
            margin-right: 10px;
            font-size: x-large;
            cursor: pointer;
          "
          matTooltip="Help"
        ></i>

        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="25"
          height="25"
          fill="#ffffff"
          viewBox="0 0 256 256"
        >
          <path
            d="M234.38,210a123.36,123.36,0,0,0-60.78-53.23,76,76,0,1,0-91.2,0A123.36,123.36,0,0,0,21.62,210a12,12,0,1,0,20.77,12c18.12-31.32,50.12-50,85.61-50s67.49,18.69,85.61,50a12,12,0,0,0,20.77-12ZM76,96a52,52,0,1,1,52,52A52.06,52.06,0,0,1,76,96Z"
          ></path>
        </svg>
        <div style="margin: 0 10px 0 5px" class="onHover">
          <span class="user-title">Welcome, {{ userName }}</span>
          <i
            class="fa fa-angle-down"
            style="color: white; font-size: medium; margin-left: 5px"
          ></i>
        </div>
      </div>
    </div>
    <div class="navbar">
      <ul class="menu">
        <!-- Home -->
        <li class="menu-item" [class.disabled]="!isAdmin$">
          <a [routerLink]="'/home'" class="top-link">
            <i class="svg-icon home-icon" style="font-weight: 900"></i>
          </a>
        </li>

        <!-- Period Close Tracking -->
        <li
          class="menu-item"
          [class.disabled]="
            !(
              hasRole$([
                'PERIOD_CLOSE',
                'WD0',
                'MIDCLOSE_VOLUMES',
                'LARGE_DEAL'
              ]) || isAdmin$
            )
          "
        >
          <a
            [routerLink]="'/period-close-tracking'"
            class="top-link"
            style="font-weight: 500"
          >
            Continuous Monitoring
          </a>
        </li>

        <!-- Invoice to Cash -->
        <li
          class="menu-item"
          [class.disabled]="!(hasRole$(['LARGE_DEAL']) || isAdmin$)"
        >
          <a
            [routerLink]="'/business-insights'"
            class="top-link"
            style="font-weight: 500"
          >
            Business Insights
          </a>
        </li>

        <!-- Revenue Accounting -->
        <li
          class="menu-item"
          [class.disabled]="
            !(
              hasRole$([
                'EXCEPTION_ADMIN',
                'EXCEPTION_READ_ONLY',
                'ACCOUNT_RECON'
              ]) || isAdmin$
            )
          "
        >
          <a
            [routerLink]="'/case-analyzer'"
            class="top-link"
            style="font-weight: 500"
          >
            ESP Case Manager
          </a>
        </li>
      </ul>
    </div>
  </mat-toolbar>
</div>

<mat-sidenav-container class="example-container">
  <mat-sidenav-content>
    <div>
      <app-menu *ngIf="showMenu"></app-menu>
      <router-outlet></router-outlet>
      <br />
      <br />
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
