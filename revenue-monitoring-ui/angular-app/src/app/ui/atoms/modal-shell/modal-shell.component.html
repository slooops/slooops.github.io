@if (isOpen) {
  <div
    class="fit-modal-backdrop"
    (click)="onBackdropClick($event)"
  >
    <div
      class="fit-modal"
      role="dialog"
      aria-modal="true"
      [attr.aria-labelledby]="title"
    >
      <div class="fit-modal__header">
        <h2 class="fit-modal__title">{{ title }}</h2>
        <button
          class="fit-btn fit-btn--ghost fit-modal__close"
          (click)="onClose()"
          aria-label="Close modal"
        >
          ✕
        </button>
      </div>
      <div class="fit-modal__body">
        <ng-content></ng-content>
      </div>
      <div class="fit-modal__footer">
        <ng-content select="[slot=footer]"></ng-content>
      </div>
    </div>
  </div>
}
