<div class="help-content">
  <ul>
    @for (section of helpSections; track section) {
      <li>
        <button (click)="toggleSection(section.dashboard)">
          {{ section.dashboard | titlecase }}
        </button>
        @if (expandedSection === section.dashboard) {
          <div class="help-text">
            {{ section.helpText }}
          </div>
        }
      </li>
    }
  </ul>
</div>
