<div class="modal-overlay" (click)="closeDialog('cancel')">
  <div class="modal-content container" (click)="$event.stopPropagation()">
    <div
      style="
        margin: -24px -24px 0 -24px; /* Removes default padding */
        background-color: #08ace4;
        padding: 10px;
        color: white;
        display: flex;
        justify-content: space-between;
        align-items: center;
      "
    >
      <h5
        class="section-title"
        style="margin: 0; color: white; font-weight: lighter"
      >
        Assign User
      </h5>
      <i
        class="fa fa-close"
        (click)="closeDialog('cancel')"
        style="cursor: pointer; color: white; font-size: 16px"
      ></i>
    </div>

    <div class="modal-body">
      <form [formGroup]="updateForm" class="form-stack">
        <div class="input-stack" *ngFor="let field of disabledFields">
          <label>{{ field.label }}</label>
          <input
            type="text"
            [formControlName]="field.controlName"
            [attr.disabled]="true"
            [placeholder]="'Enter ' + field.label"
          />
        </div>

        <div class="input-stack" *ngFor="let field of enabledFields">
          <label>{{ field.label }}</label>
          <ng-container *ngIf="field.controlName === 'assignedTo'">
            <select [formControlName]="field.controlName" required>
              <option value="" disabled selected hidden>Select User</option>
              <option
                *ngFor="let data of assignmentUsers"
                [value]="data.LOOKUP_CODE"
              >
                {{ data.LOOKUP_CODE }}
              </option>
            </select>
          </ng-container>
          <ng-container *ngIf="field.controlName !== 'assignedTo'">
            <input
              type="text"
              [formControlName]="field.controlName"
              [placeholder]="'Enter ' + field.label"
            />
          </ng-container>
        </div>
      </form>
    </div>

    <div class="modal-footer">
      <button class="custom-button-tertiary" (click)="closeDialog('cancel')">
        Cancel
      </button>
      <button
        class="custom-button-primary"
        [disabled]="updateForm.invalid"
        (click)="submitData()"
      >
        Save
      </button>
    </div>
  </div>
</div>
