<app-modal-shell
  title="Assign User"
  [isOpen]="true"
  (close)="closeDialog('cancel')"
>
  <div class="fit-assign-body">
    @if (formReady()) {
      <form [formGroup]="updateForm" class="fit-assign-form">
        @for (field of fieldConfig(); track field.controlName) {
          <div class="fit-assign-field">
            <label class="fit-assign-label">{{ field.label }}</label>
            @if (field.controlName === "assignedTo") {
              <app-single-select-dropdown
                [options]="assignmentUserOptions()"
                [selected]="updateForm.get('assignedTo')?.value || ''"
                placeholder="Select User"
                (selectionChange)="onAssignedToChange($event)"
              ></app-single-select-dropdown>
            } @else {
              @if (field.options?.length) {
                <app-single-select-dropdown
                  [options]="field.options"
                  [selected]="updateForm.get(field.controlName)?.value || ''"
                  [placeholder]="'Select ' + field.label"
                  (selectionChange)="onFieldChange(field.controlName, $event)"
                ></app-single-select-dropdown>
              } @else {
                <input
                  class="fit-assign-control"
                  type="text"
                  [formControlName]="field.controlName"
                  [placeholder]="'Enter ' + field.label"
                />
              }
            }
          </div>
        }
      </form>
    }
  </div>

  <div slot="footer" class="fit-assign-footer">
    <button
      class="fit-btn fit-btn--secondary"
      type="button"
      (click)="closeDialog('cancel')"
    >
      Cancel
    </button>
    <button
      class="fit-btn fit-btn--primary"
      type="button"
      [disabled]="!formReady() || updateForm.invalid"
      (click)="submitData()"
    >
      Save
    </button>
  </div>
</app-modal-shell>
