<h2 mat-dialog-title>
  Order Lifecycle Summary
  <a style="float: right !important; text-decoration: none"
    ><i
      class="fa fa-close"
      style="font-size: 24px; color: gray"
      (click)="closeDialog()"
    ></i
  ></a>
</h2>

<div
  style="
    display: flex;
    justify-content: end;
    align-items: center;
    padding-bottom: 8px;
  "
>
  <button
    mat-stroked-button
    (click)="
      exportTableToExcel(
        summaryModel,
        'Large Order Lifecycle SUmmary',
        'large_order_lifecycle_summary'
      )
    "
  >
    Download
  </button>
</div>

<!-- <button mat-stroked-button (click)="closeDialog()">X</button> -->

<mat-dialog-content>
  <div
    class="periodclosetbale sortArrow"
    style="overflow: auto; max-width: 100%"
  >
    <table
      style="width: -webkit-fill-available"
      mat-table
      [dataSource]="dataSource"
      class="table table-responsive orderTable"
    >
      <!-- PROGRAM_NAME Column -->
      <ng-container matColumnDef="PROGRAM_NAME">
        <th mat-header-cell *matHeaderCellDef>PROGRAM NAME</th>
        <td mat-cell *matCellDef="let record">{{ record.PROGRAM_NAME }}</td>
      </ng-container>

      <!-- STATUS Column -->
      <ng-container matColumnDef="STATUS">
        <th mat-header-cell *matHeaderCellDef>STATUS</th>
        <td mat-cell *matCellDef="let record">{{ record.STATUS }}</td>
      </ng-container>

      <!-- ORDER_COUNT Column -->
      <ng-container matColumnDef="ORDER_COUNT">
        <th mat-header-cell *matHeaderCellDef>ORDER COUNT</th>
        <td mat-cell *matCellDef="let record">{{ record.ORDER_COUNT }}</td>
      </ng-container>

      <!-- COMPLETION Column -->
      <ng-container matColumnDef="COMPLETION">
        <th mat-header-cell *matHeaderCellDef>COMPLETION</th>
        <td mat-cell *matCellDef="let record">
          {{ record.COMPLETION !== null ? record.COMPLETION + "%" : "" }}
        </td>
      </ng-container>

      <!-- Table header -->
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>

      <!-- Table rows -->
      <tr
        mat-row
        *matRowDef="let record; columns: displayedColumns; let entry"
        [ngClass]="{ bold: entry.PROGRAM_NAME.includes('Total') }"
      ></tr>
    </table>
  </div>
</mat-dialog-content>

<br />
