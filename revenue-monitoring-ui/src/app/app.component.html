<!-- Top navbar  -->
<div class="row">
  <mat-toolbar style="background-color: #049fd9; width: 100%">
    <div class="col-lg-4">
      <button
        mat-button
        style="background-color: #049fd9"
        (click)="menu.toggle()"
      >
        <i
          class="fa fa-bars"
          aria-hidden="true"
          style="font-size: 32px; color: white"
        ></i>
      </button>
      &nbsp;
      <span class="icon-cisco icon-size-48" style="color: white"></span>
    </div>
    <div class="col-lg-4" style="text-align: center">
      <h2 style="color: white">Operations Dashboard</h2>
    </div>

      <button

      >
        <i class="fa fa-user-circle-o" style="font-size: 16px"></i>&nbsp;<b>{{
          username
        }}</b>
        &nbsp;
        <i class="fa fa-caret-down"></i>
      </button>
    </div> -->
  </mat-toolbar>
</div>

<!-- Side nav implementation -->
<mat-sidenav-container class="example-container">
  <mat-sidenav #menu mode="side">
    <app-menu></app-menu>
  </mat-sidenav>
  <mat-sidenav-content style="background-color: white">
    <div class="col-lg-12">
      <router-outlet></router-outlet>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>

<!-- Sign out -->
<mat-menu #logoutMenu="matMenu">
  <button mat-menu-item><i class="fa fa-sign-out"></i>&nbsp;Sign out</button>
</mat-menu>
