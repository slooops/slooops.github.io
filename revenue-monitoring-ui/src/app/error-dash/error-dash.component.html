  <div
    style="
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 8px;
    "
  >
    <h2>Error Summary</h2>
    <button mat-stroked-button (click)="viewDetails()">
      {{ selection.hasValue() ? "View Selected" : "View Details" }}
    </button>
  </div>
  <table
    style="width: -webkit-fill-available"
    mat-table
    [dataSource]="dataSource"
    matSort
    class="mat-elevation-z8"
  >
    <!-- Selection Column -->
    <ng-container matColumnDef="select">
      <th mat-header-cell *matHeaderCellDef>
        <mat-checkbox
          (change)="$event ? masterToggle() : null"
          [checked]="selection.hasValue() && isAllSelected()"
          [indeterminate]="selection.hasValue() && !isAllSelected()"
        >
        </mat-checkbox>
      </th>
      <td mat-cell *matCellDef="let row">
        <mat-checkbox
          (click)="$event.stopPropagation()"
          (change)="$event ? selection.toggle(row) : null"
          [checked]="selection.isSelected(row)"
        >
        </mat-checkbox>
      </td>
    </ng-container>
    <!-- Period Year Column -->
    <!-- <ng-container matColumnDef="PERIOD_YEAR">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Period Year</th>
      <td mat-cell *matCellDef="let record">{{ record.PERIOD_YEAR }}</td>
    </ng-container> -->

    <!-- Period Name Column -->
    <ng-container matColumnDef="PERIOD_NAME">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Period Name</th>
      <td mat-cell *matCellDef="let record">{{ record.PERIOD_NAME }}</td>
    </ng-container>

    <!-- Application Name Column -->
    <ng-container matColumnDef="APPLICATION_NAME">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>
        Application Name
      </th>
      <td mat-cell *matCellDef="let record">{{ record.APPLICATION_NAME }}</td>
    </ng-container>

    <!-- Batch Source Column -->
    <ng-container matColumnDef="BATCH_SOURCE">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Batch Source</th>
      <td mat-cell *matCellDef="let record">{{ record.BATCH_SOURCE }}</td>
    </ng-container>

    <!-- Entity Column -->
    <ng-container matColumnDef="ENTITY">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Entity</th>
      <td mat-cell *matCellDef="let record">{{ record.ENTITY }}</td>
    </ng-container>

    <!-- Transaction Type Column -->
    <ng-container matColumnDef="TRANSACTION_TYPE">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>
        Transaction Type
      </th>
      <td mat-cell *matCellDef="let record">{{ record.TRANSACTION_TYPE }}</td>
    </ng-container>

    <!-- Amount USD Column -->
    <ng-container matColumnDef="AMOUNT_USD">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Amount USD</th>
      <td mat-cell *matCellDef="let record">{{ record.AMOUNT_USD }}</td>
    </ng-container>

    <!-- Number of Records Column -->
    <ng-container matColumnDef="NO_OF_RECORDS">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>No. of Records</th>
      <td mat-cell *matCellDef="let record">{{ record.NO_OF_RECORDS }}</td>
    </ng-container>

    <!-- Table header -->
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>

    <!-- Table rows -->
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>

  <div style="display: flex; justify-content: center">
    <ng-container *ngIf="!dataSource?.data?.length">
      <tr>
        <td colspan="100%" style="text-align: center">
          <app-loading-symbol></app-loading-symbol>
        </td>
      </tr>
    </ng-container>
  </div>

  <mat-paginator
    [pageSize]="15"
    length="length"
    [pageSizeOptions]="[]"
    showFirstLastButtons
    aria-label="Select page"
  >
  </mat-paginator>
</div>

<br />
