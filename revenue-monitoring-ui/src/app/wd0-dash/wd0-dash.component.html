<div style="float: right; margin-right: 20px; margin-top: -35px">
  <span>
    <mat-form-field appearance="standard">
      <mat-label>Select Statuses</mat-label>
      <mat-select [formControl]="" id="status" name="status" multiple>
        <mat-option> Completed </mat-option>
        <mat-option> N/A </mat-option>
      </mat-select>
    </mat-form-field>
  </span>

<h5 style="margin-left: 10px">AR Close</h5>

<div class="arclosetbale sortArrow">
  <table
    mat-table
    [dataSource]="phase1DataSource"
    matSort
    #phase1Sort="matSort"
    class="mat-elevation-z8 table table-responsive"
  >
    <ng-container
      *ngFor="let column of phase1DisplayedColumns"
      matColumnDef="{{ column }}"
    >
      <th class="custom-cell" mat-header-cell *matHeaderCellDef mat-sort-header>
        {{ column }}
      </th>
      <td class="custom-cell" mat-cell *matCellDef="let record">
        {{ record[column] }}
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="phase1DisplayedColumns"></tr>
    <tr
      mat-row
      class="table-row"
      *matRowDef="let row; columns: phase1DisplayedColumns"
    ></tr>
  </table>
</div>
