<h2 style="padding-top: 14px">Mid Close Invoice Lines</h2>

<div class="chart-carousel">
  <div class="chart-box">
    <canvas id="barChartCanvasId"></canvas>
  </div>

  <div class="chart-box">
    <canvas id="lineChartCanvasId"></canvas>
  </div>
</div>

<div class="row">
  <div class="col-sm-4">
    <h4 style="padding-top: 14px">Mid Close Volumes Data</h4>
  </div>
  <div
    class="col-sm-5 justify-content-center align-items-center"
    style="display: flex; align-items: center; padding-top: 16px"
  >
    <p class="m-0">Legend: Number of lines</p>
  </div>
  <div
    class="col-sm-3 justify-content-end align-items-center"
    style="display: flex"
  >
    <button
      mat-stroked-button
      (click)="
        exportTableToExcel(
          historicalData,
          'HistoricalData',
          'HistoricalDataReport'
        )
      "
    >
      Download
    </button>
  </div>
</div>

<div class="periodclosetbale sortArrow" style="overflow: auto; max-width: 100%">
  <table
    mat-table
    [dataSource]="dataSource"
    class="table table-responsive table-striped"
  >
    <ng-container
      *ngFor="let column of displayedColumns; let i = index"
      [matColumnDef]="column"
    >
      <th mat-header-cell *matHeaderCellDef>
        {{ formatColumnHeader(column) | uppercase }}
      </th>
      <td mat-cell *matCellDef="let record">
        <span *ngIf="column == 'ENTITY' || column == 'LINE_TYPE'"
          ><b> {{ record[column] }}</b></span
        >
        <span *ngIf="column != 'ENTITY' && column != 'LINE_TYPE'">{{
          record[column]
        }}</span>
      </td>
    </ng-container>
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr
      mat-row
      *matRowDef="let row; columns: displayedColumns; let entry"
      [ngClass]="{ boldrow: entry.ENTITY == 'Grand Total' }"
    ></tr>
  </table>
</div>

<div style="display: flex; justify-content: center">
  <ng-container *ngIf="!dataSource?.data?.length">
    <tr>
      <td colspan="100%" style="text-align: center">
        <app-loading-symbol></app-loading-symbol>
      </td>
    </tr>
  </ng-container>
</div>
