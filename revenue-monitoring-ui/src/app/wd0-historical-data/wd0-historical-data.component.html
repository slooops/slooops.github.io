<div class="row">
  <div class="col-sm-3">
    <h4 style="padding-top: 14px">Mid Close Invoice Volumes Data</h4>
  </div>
  <div
    class="col-sm-6 justify-content-center align-items-center"
    style="display: flex; align-items: center; padding-top: 16px"
  >
    <p class="m-0">Legend: Number of lines</p>
  </div>
  <div
    class="col-sm-3 justify-content-end align-items-center"
    style="display: flex"
  >
    <button
      mat-stroked-button
      (click)="
        exportTableToExcel(
          historicalData,
          'HistoricalData',
          'HistoricalDataReport'
        )
      "
    >
      Download
    </button>
  </div>
</div>

<div class="periodclosetbale sortArrow" style="overflow: auto; max-width: 100%">
  <table
    mat-table
    [dataSource]="dataSource"
    class="mat-elevation-z6 table table-responsive table-striped"
  >
    <ng-container *ngFor="let column of displayedColumns">
      <ng-container matColumnDef="{{ column }}">
        <th mat-header-cell *matHeaderCellDef>
          {{ formatColumnHeader(column) }}
        </th>
        <td mat-cell *matCellDef="let record">{{ record[column] }}</td>
      </ng-container>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>
</div>
