<div class="sticky-charts">
  <div class="chart-carousel">
    <div class="chart-box">
      <div class="chart-header">
        <h6>Service & Product Lines</h6>
        <a (click)="openChartDialog('bar')">
          <i class="fa fa-arrows-alt"></i>
        </a>
      </div>
      <canvas id="barChartCanvasId"></canvas>
    </div>

    <div class="chart-box">
      <div class="chart-header">
        <h6>Total Lines by Entity</h6>
        <a (click)="openChartDialog('line')">
          <i class="fa fa-arrows-alt"></i>
        </a>
      </div>
      <canvas id="lineChartCanvasId"></canvas>
    </div>
  </div>
</div>

<ng-template #barChartTemplate>
  <div class="chart-header">
    <h6>Service & Product Lines</h6>
    <div>
      <a (click)="downloadChart('modalBarChartCanvasId', 'barChart.png')">
        <i style="padding-right: 10px" class="fa fa-download"></i>
      </a>
      <a (click)="closeDialog()">
        <i class="fa fa-times"></i>
      </a>
    </div>
  </div>
  <canvas id="modalBarChartCanvasId"></canvas>
</ng-template>

<ng-template #lineChartTemplate>
  <div class="chart-header">
    <h6>Total Lines by Entity</h6>
    <div>
      <a
        style="padding-right: 10px"
        (click)="downloadChart('modalLineChartCanvasId', 'lineChart.png')"
      >
        <i class="fa fa-download"></i>
      </a>
      <a (click)="closeDialog()">
        <i class="fa fa-times"></i>
      </a>
    </div>
  </div>
  <canvas id="modalLineChartCanvasId"></canvas>
</ng-template>

<div style="position: sticky" class="row">
  <div class="col-sm-4">
    <h4 style="padding-top: 14px">Mid Close Volumes Data</h4>
  </div>
  <div
    class="col-sm-5 justify-content-center align-items-center"
    style="display: flex; align-items: center; padding-top: 16px"
  >
    <p class="m-0">Legend: Number of lines</p>
  </div>
  <div
    class="col-sm-3 justify-content-end align-items-center"
    style="display: flex"
  >
    <button
      mat-stroked-button
      (click)="
        exportTableToExcel(
          historicalData,
          'HistoricalData',
          'HistoricalDataReport'
        )
      "
    >
      Download
    </button>
  </div>
</div>

<div
  class="scrollable-table periodclosetbale sortArrow"
  style="overflow: auto; max-width: 100%"
>
  <table
    mat-table
    [dataSource]="dataSource"
    class="table table-responsive table-striped"
  >
    <ng-container
      *ngFor="let column of displayedColumns; let i = index"
      [matColumnDef]="column"
    >
      <th *matHeaderCellDef>
        {{ formatColumnHeader(column) | uppercase }}
      </th>
      <td mat-cell *matCellDef="let record">
        <span *ngIf="column == 'ENTITY' || column == 'LINE_TYPE'"
          ><b> {{ record[column] }}</b></span
        >
        <span *ngIf="column != 'ENTITY' && column != 'LINE_TYPE'">{{
          record[column]
        }}</span>
      </td>
    </ng-container>
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr
      mat-row
      *matRowDef="let row; columns: displayedColumns; let entry"
      [ngClass]="{ boldrow: entry.ENTITY == 'Grand Total' }"
    ></tr>
  </table>
  <br />
  <br />
</div>

<div style="display: flex; justify-content: center">
  <ng-container *ngIf="!dataSource?.data?.length">
    <tr>
      <td colspan="100%" style="text-align: center">
        <app-loading-symbol></app-loading-symbol>
      </td>
    </tr>
  </ng-container>
</div>
