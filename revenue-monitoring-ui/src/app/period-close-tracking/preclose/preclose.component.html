<br>
<div class="container" style="overflow: auto;">
  <div class="col-lg-4" style="float: left;">
    <div>
      <label>Quarter: &nbsp;</label>
      <span> {{quarter}}</span>
    </div>
    <div>
      <label>Period: &nbsp;</label>
      <span> {{period}}</span>
    </div>
    <div>
      <label>Scheduled Start: &nbsp;</label>
      <span> {{preCloseStartTime}}</span>
    </div>
    <div>
      <label>Scheduled End: &nbsp;</label>
      <span> {{preCloseEndTime}}</span>
    </div>
    <div>
      <label>Expected Close Time: &nbsp;</label>
      <span *ngIf="!closeTimeEdit"> {{preCloseEndTime}}
        <i id="editCloseTime" class="fa fa-edit" (click)="editContent($event)"></i>
      </span>
      <span *ngIf="closeTimeEdit">
        <input type="date" id="closeTime" name="closeTime">&nbsp;
        <input id="updateCloseTime" type="submit" value="Update" (click)="updateContent($event)">
      </span>
    </div>
    <br>
    <div>
      <span>
        <label for="entity">Entity:&nbsp;</label>
        <mat-form-field appearance="fill">
          <mat-label>Select</mat-label>
          <mat-select [formControl]="entities" id="entity" name="entity" [(ngModel)]="selectedEntities" (ngModelChange)="selectedEntity()" multiple>
            <mat-option *ngFor="let entity of entityList" [value]="entity">{{entity}}</mat-option>
          </mat-select>
        </mat-form-field>
      </span>
    </div>
  </div>

  <br>
  <br>
  <table mat-table class="table table-responsive equal-width">
    <thead>
      <tr>
        <th *ngFor="let col of meStatusColumns">{{ col }}</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td></td>
        <td *ngFor="let category of templateObject.keys(pCloseProgBarStatusMapping)">
            <p><ngb-progressbar [showValue]="true" type="success" [value]="pCloseProgBarStatusMapping[category]['value']"></ngb-progressbar></p>
        </td>
      </tr>
      <tr *ngFor="let row of pcloseSelectedMonthEndStatusTableData">
        <td *ngFor="let category of templateObject.keys(row)">{{ row[category] }}</td>
      </tr>
    </tbody>
  </table>

  <p style="text-align: center;" id="tableHeading"><b>Interface Load</b></p>
  <table class="table table-responsive table-bordered table-striped">
    <thead>
      <tr>
        <th *ngFor="let col of interfaceLoadColumns">{{ col }}</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let row of precloseInterfaceLoadData">
        <ng-container *ngFor="let cell of row; let i = index">
          <td *ngIf="i < row.length - 2">{{ cell }}</td>
          <td *ngIf="i >= row.length - 2">
            <span *ngIf="cell.slice(0,-1) > 0">⬆</span>
            <span *ngIf="cell.slice(0,-1) < 0">⬇</span>
            {{ cell }}
          </td>
        </ng-container>
      </tr>
    </tbody>
  </table>


  <p id="tableHeading" *ngIf="preCloseProgramTableData.length"><b>Invoices Generated</b></p>
  <cui-table *ngIf="preCloseProgramTableData.length" [options]="programTableOptions" [data]="preCloseProgramTableData" style="justify-content: center;"></cui-table>
