<div style="float: right; margin-top: -25px">Updated at {{ timeNow }}</div>

<div
  style="display: flex; justify-content: space-between; align-items: flex-end"
>
  <h1 class="header-container" style="padding-left: 16px">
    Period Close Progress
  </h1>

  <h6>
    <label>Quarter:</label> &nbsp;&nbsp; {{ midcloseQuarter }} &nbsp;&nbsp; |
    &nbsp;&nbsp; <label>Period:</label> &nbsp;&nbsp; {{ midclosePeriod }}
  </h6>
</div>
<br />
<mat-tab-group animationDuration="500ms" style="padding-left: 16px">
  <mat-tab label="Pre-Close">
    <app-preclose></app-preclose>
  </mat-tab>
  <mat-tab label="Mid-Close">
    <app-midclose></app-midclose>
  </mat-tab>
</mat-tab-group>
