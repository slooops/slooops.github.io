<h1 style="padding-left: 16px">Period Close Progress</h1>
<div style="float: right; margin-top: -100px">
  Dashboard updated: <span *ngIf="timeFlag"> Just now </span>
  <span *ngIf="!timeFlag">
    {{ setTime | timeago : false }}
  </span>
</div>
<br />
<mat-tab-group animationDuration="500ms" style="padding-left: 16px">
  <mat-tab label="Pre-Close">
    <app-preclose></app-preclose>
  </mat-tab>
  <mat-tab label="Mid-Close">
    <app-midclose></app-midclose>
  </mat-tab>
</mat-tab-group>
