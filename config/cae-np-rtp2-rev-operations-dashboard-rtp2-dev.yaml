---
# Source: templates/dev.yaml

# codectl version : 1.5.6

apiVersion: v1
kind: Service
metadata:
  name: 'rev-ops-monitoring-backend-service'
  namespace: 'rev-operations-dashboard-rtp2'
  labels:
    softwareId: 'd7c7615e6575481186019c284daa67946d68f871'
    softwareName: 'rev-ops-monitoring'
spec:
  ports:
    - name: "server"
      protocol: "TCP"
      port: 8080
  selector:
      app: 'rev-ops-monitoring-server'
  type: ClusterIP
---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: 'rev-ops-monitoring-server'
  namespace: 'rev-operations-dashboard-rtp2'
  labels:
    softwareId: 'd7c7615e6575481186019c284daa67946d68f871'
    softwareName: 'rev-ops-monitoring'
spec:
  selector:
    matchLabels:
      app: 'rev-ops-monitoring-server'
  replicas: 1
  template:
    metadata:
      namespace: 'rev-operations-dashboard-rtp2'
      labels:
        app: 'rev-ops-monitoring-server'
        environment: 'dev'
        softwareId: 'd7c7615e6575481186019c284daa67946d68f871'
        softwareName: 'rev-ops-monitoring-server'
    spec:
      containers:
      - image: 'containers.cisco.com/it_cvc_order_to_cash/rev-ops-monitoring'
        imagePullPolicy: IfNotPresent
        name: 'rev-ops-monitoring-server'
        ports:
        - containerPort: 8080
        env:
            - name: DATABASE_NAME
              valueFrom:
                configMapKeyRef:
                  name: db-properties
                  key: db.name
            - name: DATABASE_URL
              valueFrom:
                configMapKeyRef:
                  name: db-properties
                  key: db.url
            - name: DATABASE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: username
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: password
            - name: TSV_TOP_SKU_EXC_QUERY
              valueFrom:
                configMapKeyRef:
                  name: db-properties
                  key: tsv.topsku.exc.query
            - name: TSV_SUB_SKU_EXC_QUERY
              valueFrom:
                configMapKeyRef:
                  name: db-properties
                  key: tsv.subsku.exc.query
            - name: STANDARD_AR_EXC_QUERY
              valueFrom:
                configMapKeyRef:
                  name: db-properties
                  key: std.ar.exc.query
            - name: CORS_URL
              valueFrom:
                configMapKeyRef:
                  name: server-properties
                  key: cors.url
      imagePullSecrets:
      - name: it-cvc-order-to-cash-cdconsole-bot-pull-secret

