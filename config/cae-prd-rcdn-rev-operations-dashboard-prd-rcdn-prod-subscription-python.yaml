---
# Source: templates/dev.yaml

# codectl version : 1.5.6

apiVersion: v1
kind: Service
metadata:
  name: "subscription-ai-backend-service-python"
  namespace: "rev-operations-dashboard-prd-rcdn"
  labels:
    # softwareId is a non-sensitive unique identifier for the software
    softwareId: "d7c7615e6575481186019c284daa67946d68f871"
    softwareName: "rev-ops-monitoring"
  annotations:
    # Increase proxy timeouts for long-running AI agent requests (LLM + tool calls)
    # dashboard-codegen runs 3 serial LLM stages; prod model can be slow.
    # Use /api/dashboard-codegen/stream (SSE) to avoid holding a silent connection.
    cae.cisco.com/proxy-read-timeout: "600"
    cae.cisco.com/proxy-send-timeout: "600"
    cae.cisco.com/proxy-connect-timeout: "60"
spec:
  ports:
    - name: "api"
      protocol: "TCP"
      port: 8000
  selector:
    app: "subscription-ai-backend-python"
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: "subscription-ai-backend-python"
  namespace: "rev-operations-dashboard-prd-rcdn"
  labels:
    # softwareId is a non-sensitive unique identifier for the software
    softwareId: "d7c7615e6575481186019c284daa67946d68f871"
    softwareName: "rev-ops-monitoring"
spec:
  selector:
    matchLabels:
      app: "subscription-ai-backend-python"
  replicas: 1
  template:
    metadata:
      namespace: "rev-operations-dashboard-prd-rcdn"
      labels:
        app: "subscription-ai-backend-python"
        environment: "prod"
        # softwareId is a non-sensitive unique identifier for the software
        softwareId: "d7c7615e6575481186019c284daa67946d68f871"
        softwareName: "rev-ops-monitoring"
    spec:
      containers:
        - image: 'containers.cisco.com/it_cvc_order_to_cash/rev-ops-monitoring:${trigger["parameters"]["imageTag"]}'
          imagePullPolicy: IfNotPresent
          name: "subscription-ai-backend-python"
          ports:
            - containerPort: 8000
      imagePullSecrets:
        - name: it-cvc-order-to-cash-cdconsole-bot-pull-secret
---
apiVersion: cae.cisco.com/v1
kind: SSOAuthConfig
metadata:
  name: agentic-python-api.cisco.com
  namespace: rev-operations-dashboard-prd-rcdn
  annotations:
    ssoauthconfig.cae.cisco.com/provider.secondary_idp: ping
spec:
  contexts:
    - context: /api/
      contextMatch: prefix
      policyType: public
      methods:
        - "*"
    - context: /ask
      contextMatch: exact
      policyType: public
      methods:
        - "POST"
    - context: /chat
      contextMatch: exact
      policyType: public
      methods:
        - "POST"
    - context: /control-tower-ui-chat
      contextMatch: exact
      policyType: public
      methods:
        - "POST"
    - context: /control-tower-ui-chat-stream
      contextMatch: exact
      policyType: public
      methods:
        - "POST"
    - context: /webhook
      contextMatch: exact
      policyType: public
      methods:
        - "POST"
    - context: /card-logo
      contextMatch: exact
      policyType: public
    - context: /snoop.jsp
      contextMatch: exact
      policyType: public
    - context: /pingpong.html
      contextMatch: exact
      policyType: public
    - context: /favicon.ico
      contextMatch: exact
      policyType: public
    - context: /.emantest.html
      contextMatch: exact
      policyType: public
    - context: /pub/
      contextMatch: prefix
      policyType: public
    - context: ^/.*/pingpong\.html$
      contextMatch: regex
      policyType: public
    - context: /
      contextMatch: prefix
      policyType: web
  policy:
    api:
      allow:
        - paths:
            - path: /api/
              pathMatch: prefix
          when:
            - kind: tokenIssuer
              values:
                - ping
    web:
      allow:
        - paths:
            - path: /
              pathMatch: prefix
          when:
            - kind: userId
              values:
                - "*"
  provider:
    cors: platform
    idp: duo
    sso: platform
