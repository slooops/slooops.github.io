spring.datasource.hikari.data-source-properties."[v$session.osuser]"=${RDAC_OSUSER}

# Primary Database Configuration
spring.datasource.primary.url = ${DATABASE_URL}
spring.datasource.primary.username = ${DATABASE_USERNAME}
spring.datasource.primary.password = ${DATABASE_PASSWORD}
spring.datasource.primary.driver-class-name=oracle.jdbc.OracleDriver

# Secondary Database Configuration
spring.datasource.secondary.url=${CFN_DATABASE_URL}
spring.datasource.secondary.username=${CFN_DATABASE_USERNAME}
spring.datasource.secondary.password=${CFN_DATABASE_PASSWORD}
spring.datasource.secondary.driver-class-name=oracle.jdbc.OracleDriver

spring.mvc.dispatch-options-request=true
spring.thymeleaf.check-template-location=false
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

#MongoDB configuration

JAVA_OPTS=-Xmx4G -Xms2G

# Primary MongoDB Configuration
spring.data.mongodb.primary.uri=${MONGO_DB_URL}
spring.data.mongodb.primary.database=${MONGO_DB_NAME}

#debug=true

#Redis configuration -- stage
spring.data.redis.host = ${REDIS_HOST}
spring.data.redis.port = 6379
spring.data.redis.password = ${REDIS_PASSWORD}


