spring.datasource.hikari.data-source-properties."[v$session.osuser]"=${RDAC_OSUSER}

# Primary Database Configuration
spring.datasource.primary.url = ${DATABASE_URL}
spring.datasource.primary.username = ${DATABASE_USERNAME}
spring.datasource.primary.password = ${DATABASE_PASSWORD}
spring.datasource.primary.driver-class-name=oracle.jdbc.OracleDriver

# Secondary Database Configuration
spring.datasource.secondary.url=${CFN_DATABASE_URL}
spring.datasource.secondary.username=${CFN_DATABASE_USERNAME}
spring.datasource.secondary.password=${CFN_DATABASE_PASSWORD}
spring.datasource.secondary.driver-class-name=oracle.jdbc.OracleDriver

spring.mvc.dispatch-options-request=true
spring.thymeleaf.check-template-location=false
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

#MongoDB configuration

JAVA_OPTS=-Xmx4G -Xms2G

# Primary MongoDB Configuration
spring.data.mongodb.primary.uri=${MONGO_DB_URL}
spring.data.mongodb.primary.database=${MONGO_DB_NAME}

#debug=true

#Redis configuration -- stage
spring.data.redis.host = ${REDIS_HOST}
spring.data.redis.port = 6379
spring.data.redis.password = ${REDIS_PASSWORD}

# ── Control-M sync (background poller → ARFINRO.CTM_AI_ALERTS) ───────────────
# Default ON so the deployed (prod/stage) pods run the sync without anyone having
# to remember to flip a flag at deploy time.
#
# LOCAL DEV NOTE: if you don't have FIN_O2C_PROD_CTM_KEY / FIN_I2C_PROD_CTM_KEY
# set in your IntelliJ run config, the poller will log this every 60s:
#     [CTM] No API key configured for scope ctmpsrv1/FIN_O2C — skipping.
#     [CTM] No API key configured for scope ctmpsrv2/FIN_I2C — skipping.
# That is EXPECTED and harmless — no CTM calls are made, no DB writes happen.
# To silence locally, either set CONTROLM_SYNC_ENABLED=false in your run config,
# or get the keys from a teammate and set them in your run config.
controlm.sync.enabled=${CONTROLM_SYNC_ENABLED:true}
controlm.sync.api-base=${CTM_API_BASE:https://ctm-p.cisco.com:8443/automation-api}
controlm.sync.verify-ssl=${CTM_VERIFY_SSL:false}
controlm.sync.poll-interval-seconds=${POLL_INTERVAL_SECONDS:60}
controlm.sync.fetch-limit=${CTM_FETCH_LIMIT:100}

# Two scopes — one per CTM application. API keys come from env (Vault in prod).
controlm.sync.scopes[0].server=${CTM_SERVER_O2C:ctmpsrv1}
controlm.sync.scopes[0].application=FIN_O2C
controlm.sync.scopes[0].api-key=${FIN_O2C_PROD_CTM_KEY:}
controlm.sync.scopes[1].server=${CTM_SERVER_I2C:ctmpsrv2}
controlm.sync.scopes[1].application=FIN_I2C
controlm.sync.scopes[1].api-key=${FIN_I2C_PROD_CTM_KEY:}

