#spring.data.mongodb.secondary.database=opldb

#Secondary MongoDB Configuration
spring.data.mongodb.secondary.uri=mongodb+srv://oplmonitor_user:Cisco123$@mgdb-oplts1.cisco.com/opldb?ssl=true&retryWrites=true&loadBalanced=false&serverSelectionTimeoutMS=5000&connectTimeoutMS=10000&authSource=admin&authMechanism=SCRAM-SHA-1
spring.data.mongodb.secondary.database=opldb

#debug=true

#Redis configuration -- stage
spring.redis.host = ${REDIS_HOST}
spring.redis.port = 6379
spring.redis.password = ${REDIS_PASSWORD}


